<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards – Ecología (Smith & Smith)</title>
  <style>
    /* ══════════════════════════════════════════
       GLOBAL RESET & FONTS
    ══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #0f1117;
      --bg2: #1a1d2e;
      --bg3: #22263a;
      --accent: #6c63ff;
      --accent2: #48cfad;
      --accent3: #fd9644;
      --text: #e8eaf6;
      --text2: #9fa8c7;
      --card-bg: #1e2235;
      --card-border: #2e3250;
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
      --radius: 18px;
      --transition: 0.6s cubic-bezier(0.4,0.2,0.2,1);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ══════════════════════════════════════════
       HEADER
    ══════════════════════════════════════════ */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--card-border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 1.5rem; }
    header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    header small { color: var(--text2); font-size: 0.78rem; }
    .header-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }

    /* ══════════════════════════════════════════
       PROGRESS BAR
    ══════════════════════════════════════════ */
    .progress-bar {
      height: 4px;
      background: var(--card-border);
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.4s ease;
    }

    /* ══════════════════════════════════════════
       MAIN LAYOUT
    ══════════════════════════════════════════ */
    .container {
      display: flex;
      flex: 1;
      gap: 0;
    }

    /* ══════════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════════ */
    .sidebar {
      width: 280px;
      min-width: 220px;
      background: var(--bg2);
      border-right: 1px solid var(--card-border);
      padding: 20px 12px;
      overflow-y: auto;
      max-height: calc(100vh - 70px);
      position: sticky;
      top: 70px;
    }
    .sidebar h3 { font-size: 0.72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text2); padding: 0 8px; margin-bottom: 10px; }
    .cat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: transparent;
      color: var(--text2);
      font-size: 0.85rem;
      text-align: left;
      transition: background 0.2s, color 0.2s;
      margin-bottom: 2px;
    }
    .cat-btn:hover { background: var(--bg3); color: var(--text); }
    .cat-btn.active { background: var(--accent); color: #fff; }
    .cat-btn .cat-count {
      margin-left: auto;
      font-size: 0.72rem;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 2px 8px;
    }
    .cat-btn .cat-icon { font-size: 1rem; }
    .sidebar-sep { height: 1px; background: var(--card-border); margin: 14px 0; }
    .stats-mini { padding: 0 8px; }
    .stats-mini p { font-size: 0.8rem; color: var(--text2); margin-bottom: 6px; }
    .stat-row { display: flex; justify-content: space-between; font-size: 0.82rem; }
    .stat-row span:last-child { font-weight: 600; color: var(--accent2); }

    /* ══════════════════════════════════════════
       MAIN CONTENT
    ══════════════════════════════════════════ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
      gap: 28px;
    }

    /* ══════════════════════════════════════════
       CARD SCENE
    ══════════════════════════════════════════ */
    .scene {
      perspective: 1200px;
      width: 100%;
      max-width: 740px;
    }
    .card-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      position: relative;
      transform-style: preserve-3d;
      transition: transform var(--transition);
      cursor: pointer;
    }
    .card-wrapper.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 36px 48px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .card-front {
      background: linear-gradient(135deg, var(--card-bg) 0%, #262a44 100%);
    }
    .card-back {
      background: linear-gradient(135deg, #1a2a3a 0%, #0f2235 100%);
      transform: rotateY(180deg);
      border-color: var(--accent2);
    }

    .card-category {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(108,99,255,0.2);
      color: var(--accent);
      border: 1px solid rgba(108,99,255,0.3);
    }
    .card-back .card-category { background: rgba(72,207,173,0.2); color: var(--accent2); border-color: rgba(72,207,173,0.3); }

    .card-num {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 0.72rem;
      color: var(--text2);
    }

    .card-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text2);
      margin-bottom: 14px;
    }
    .card-back .card-label { color: var(--accent2); }

    .card-text {
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      font-weight: 500;
      line-height: 1.55;
      max-width: 90%;
    }
    .card-back .card-text { font-size: clamp(0.88rem, 1.8vw, 1.1rem); line-height: 1.6; color: #cdd8f0; }

    .flip-hint {
      position: absolute;
      bottom: 14px;
      right: 20px;
      font-size: 0.7rem;
      color: var(--text2);
      opacity: 0.6;
    }

    /* ══════════════════════════════════════════
       CONTROLS
    ══════════════════════════════════════════ */
    .controls {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 11px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      transition: transform 0.15s, opacity 0.15s, background 0.2s;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.92; }
    .btn:active { transform: translateY(0); opacity: 0.8; }
    .btn-prev { background: var(--bg3); color: var(--text); border: 1px solid var(--card-border); }
    .btn-next { background: var(--bg3); color: var(--text); border: 1px solid var(--card-border); }
    .btn-flip { background: var(--accent); color: #fff; padding: 11px 32px; }
    .btn-know { background: var(--accent2); color: #0f1117; }
    .btn-dontknow { background: #e74c3c; color: #fff; }
    .btn-shuffle { background: var(--accent3); color: #0f1117; }
    .btn-reset { background: var(--bg3); color: var(--text2); border: 1px solid var(--card-border); font-size: 0.8rem; }

    .counter-display {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text2);
      min-width: 80px;
      text-align: center;
    }

    /* ══════════════════════════════════════════
       FEEDBACK INDICATOR
    ══════════════════════════════════════════ */
    .feedback {
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      height: 24px;
      transition: opacity 0.3s;
    }
    .feedback.know { color: var(--accent2); }
    .feedback.dontknow { color: #e74c3c; }

    /* ══════════════════════════════════════════
       SEARCH
    ══════════════════════════════════════════ */
    .search-bar {
      display: flex;
      align-items: center;
      background: var(--bg3);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 16px;
      gap: 10px;
      width: 100%;
      max-width: 740px;
    }
    .search-bar input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      flex: 1;
    }
    .search-bar input::placeholder { color: var(--text2); }
    .search-icon { color: var(--text2); }

    /* ══════════════════════════════════════════
       GRID VIEW (LIST MODE)
    ══════════════════════════════════════════ */
    .view-toggle {
      display: flex;
      gap: 6px;
      background: var(--bg3);
      border-radius: 10px;
      padding: 4px;
    }
    .view-btn {
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 1rem;
      transition: background 0.2s, color 0.2s;
    }
    .view-btn.active { background: var(--accent); color: #fff; }

    .grid-view {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 1200px;
    }
    .grid-view.show { display: grid; }
    .study-view { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
    .study-view.hide { display: none; }

    .grid-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .grid-card:hover { border-color: var(--accent); transform: translateY(-3px); }
    .grid-card.known { border-color: var(--accent2); }
    .grid-card .gc-cat { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing:.08em; color: var(--accent); margin-bottom: 8px; }
    .grid-card .gc-q { font-size: 0.88rem; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
    .grid-card .gc-a { font-size: 0.8rem; color: var(--text2); line-height: 1.5; display: none; }
    .grid-card .gc-a.show { display: block; }
    .grid-card .gc-toggle { font-size: 0.72rem; color: var(--accent); cursor: pointer; margin-top: 8px; }

    /* ══════════════════════════════════════════
       KEYBOARD HINT
    ══════════════════════════════════════════ */
    .kb-hints {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .kb { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text2); }
    .key { background: var(--bg3); border: 1px solid var(--card-border); border-radius: 5px; padding: 2px 7px; font-family: monospace; font-size: 0.72rem; }

    /* ══════════════════════════════════════════
       TOAST
    ══════════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--bg3);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ══════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════ */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .card-face { padding: 24px 20px; }
      .card-text { font-size: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🌿</div>
  <div>
    <h1>Ecología – Smith &amp; Smith</h1>
    <small>Tarjetas de estudio interactivas</small>
  </div>
  <div class="header-right">
    <div class="view-toggle">
      <button class="view-btn active" id="btnStudy" title="Modo estudio" onclick="setView('study')">📖</button>
      <button class="view-btn" id="btnGrid" title="Vista cuadrícula" onclick="setView('grid')">⊞</button>
    </div>
  </div>
</header>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="container">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <h3>Categorías</h3>
    <div id="catList"></div>
    <div class="sidebar-sep"></div>
    <div class="stats-mini">
      <p>Tu progreso</p>
      <div class="stat-row"><span>Vistas</span><span id="sSeen">0</span></div>
      <div class="stat-row"><span>Dominadas ✓</span><span id="sKnown">0</span></div>
      <div class="stat-row"><span>Por repasar ✗</span><span id="sDontKnow">0</span></div>
      <div class="stat-row"><span>Restantes</span><span id="sLeft">0</span></div>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main">

    <!-- SEARCH -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar tarjeta…" oninput="onSearch(this.value)" />
    </div>

    <!-- STUDY VIEW -->
    <div class="study-view" id="studyView">
      <div class="scene">
        <div class="card-wrapper" id="cardWrapper" onclick="flipCard()">
          <div class="card-face card-front">
            <div class="card-category" id="frontCat">Categoría</div>
            <div class="card-num" id="cardNum">1 / 1</div>
            <div class="card-label">Pregunta</div>
            <div class="card-text" id="frontText">Cargando…</div>
            <div class="flip-hint">Haz clic para voltear · Espacio</div>
          </div>
          <div class="card-face card-back">
            <div class="card-category" id="backCat">Categoría</div>
            <div class="card-label">Respuesta</div>
            <div class="card-text" id="backText">…</div>
          </div>
        </div>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="controls">
        <button class="btn btn-dontknow" onclick="markCard(false)">✗ No sé</button>
        <button class="btn btn-prev" onclick="prevCard()">◀ Anterior</button>
        <div class="counter-display" id="counterDisplay">1/1</div>
        <button class="btn btn-next" onclick="nextCard()">Siguiente ▶</button>
        <button class="btn btn-know" onclick="markCard(true)">✓ Lo sé</button>
      </div>
      <div class="controls">
        <button class="btn btn-flip" onclick="flipCard()">↻ Voltear</button>
        <button class="btn btn-shuffle" onclick="shuffle()">🔀 Aleatorio</button>
        <button class="btn btn-reset" onclick="resetProgress()">↺ Reiniciar</button>
      </div>

      <div class="kb-hints">
        <div class="kb"><span class="key">Espacio</span> voltear</div>
        <div class="kb"><span class="key">←</span> anterior</div>
        <div class="kb"><span class="key">→</span> siguiente</div>
        <div class="kb"><span class="key">K</span> lo sé</div>
        <div class="kb"><span class="key">N</span> no sé</div>
        <div class="kb"><span class="key">S</span> aleatorio</div>
      </div>
    </div>

    <!-- GRID VIEW -->
    <div class="grid-view" id="gridView"></div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════
   DATOS: TODAS LAS FLASHCARDS
══════════════════════════════════════════════════ */
const flashcards = [

/* ─── UNIDAD 1: INTRODUCCIÓN A LA ECOLOGÍA ─── */
{cat:"Introducción", q:"¿Qué es la ecología?", a:"Ciencia que estudia las interacciones entre los organismos y su ambiente (biótico y abiótico). El término fue acuñado por Ernst Haeckel en 1866, derivado del griego 'oikos' (casa) y 'logos' (estudio)."},
{cat:"Introducción", q:"¿Cuáles son los niveles de organización en ecología?", a:"Individuo → Población → Comunidad → Ecosistema → Paisaje → Bioma → Biosfera. Cada nivel tiene propiedades emergentes que no existen en el nivel inferior."},
{cat:"Introducción", q:"¿Qué es el ambiente abiótico?", a:"Conjunto de factores físico-químicos del entorno: temperatura, luz, agua, viento, suelo, pH, salinidad, etc. Determinan el rango de tolerancia de los organismos."},
{cat:"Introducción", q:"¿Qué es el ambiente biótico?", a:"Componente vivo del ambiente: interacciones con otros organismos (competencia, depredación, mutualismo, parasitismo, comensalismo). Influye directamente en la supervivencia y reproducción."},
{cat:"Introducción", q:"¿Qué es el método científico en ecología?", a:"Proceso de observación → hipótesis → predicción → experimentación → análisis → conclusión. Incluye experimentos de campo y de laboratorio, modelos matemáticos y observaciones a largo plazo."},
{cat:"Introducción", q:"¿Qué es una hipótesis en ecología?", a:"Explicación tentativa y comprobable de un fenómeno. Debe ser falseable (Popper) y generar predicciones específicas que puedan probarse con datos."},
{cat:"Introducción", q:"¿Qué es la escala espacio-temporal en ecología?", a:"Dimensión espacial y temporal en la que ocurre un proceso. Los fenómenos ecológicos varían desde mm/segundos (fisiología) hasta km/milenios (evolución de biomas)."},
{cat:"Introducción", q:"¿Quién fue Ernst Haeckel y cuál fue su aportación?", a:"Biólogo alemán (1834-1919) que acuñó el término 'ecología' en 1866. Definió la ecología como el estudio de las relaciones entre los seres vivos y su entorno natural."},

/* ─── UNIDAD 2: FACTORES ABIÓTICOS: CLIMA ─── */
{cat:"Clima & Factores Abióticos", q:"¿Qué es el clima y cómo difiere del tiempo meteorológico?", a:"El clima es el promedio de condiciones atmosféricas (temperatura, precipitación, viento) en una región durante períodos largos (≥30 años). El tiempo meteorológico es la condición atmosférica momentánea."},
{cat:"Clima & Factores Abióticos", q:"¿Cómo afectan las corrientes de convección atmosférica al clima global?", a:"El calentamiento diferencial entre el ecuador y los polos crea celdas de convección (Hadley, Ferrel, Polar) que determinan patrones de lluvias y desiertos. El ecuador recibe más radiación solar y genera zonas de baja presión con lluvias."},
{cat:"Clima & Factores Abióticos", q:"¿Qué es el efecto Coriolis?", a:"Deflexión aparente de los vientos y corrientes oceánicas causada por la rotación terrestre. Desvía hacia la derecha en el hemisferio norte y hacia la izquierda en el sur. Crea los vientos alisios y los anticiclones."},
{cat:"Clima & Factores Abióticos", q:"¿Qué es el efecto de sombra orográfica (rain shadow)?", a:"Cuando los vientos húmedos ascienden por una montaña, se enfrían y precipitan. Al descender por el lado contrario (sotavento), el aire seco crea zonas áridas (ej: desierto de Atacama, Patagonia)."},
{cat:"Clima & Factores Abióticos", q:"¿Cómo influyen las corrientes oceánicas en el clima?", a:"Transportan calor hacia los polos (corrientes cálidas, ej: Gulf Stream) o frío hacia los trópicos (corrientes frías, ej: Humboldt). Regulan temperatura costera y precipitaciones."},
{cat:"Clima & Factores Abióticos", q:"¿Qué es El Niño - Oscilación del Sur (ENSO)?", a:"Ciclo climático irregular (3-7 años) causado por variaciones en la temperatura superficial del Pacífico ecuatorial. El Niño calienta aguas del Pacífico este, afectando lluvias y temperaturas globalmente."},
{cat:"Clima & Factores Abióticos", q:"¿Qué es el microclima?", a:"Condiciones climáticas locales que difieren del clima regional general: temperatura bajo una piedra, humedad en un bosque vs. claro, temperatura del suelo vs. aire. Permite nichos microhábitat especializados."},
{cat:"Clima & Factores Abióticos", q:"¿Cómo varía la temperatura con la altitud?", a:"Disminuye ~6.5°C por cada 1000 m de ascenso (tasa de enfriamiento adiabático). Esto crea zonación altitudinal similar a la zonación latitudinal."},
{cat:"Clima & Factores Abióticos", q:"¿Qué es la temperatura de inversión térmica?", a:"Fenómeno donde una capa de aire cálido queda atrapada sobre aire frío, impidiendo la convección vertical. Concentra contaminantes y puede ocurrir en valles y ciudades."},
{cat:"Clima & Factores Abióticos", q:"¿Qué factores determinan la temperatura global?", a:"1) Latitud (ángulo de incidencia solar), 2) Altitud, 3) Distancia al mar, 4) Corrientes oceánicas, 5) Vegetación (albedo), 6) Concentración de GEI (efecto invernadero)."},

/* ─── UNIDAD 3: FACTORES ABIÓTICOS: LUZ, AGUA Y SUELO ─── */
{cat:"Luz, Agua & Suelo", q:"¿Qué es la fotosíntesis y por qué es fundamental en ecología?", a:"Proceso por el que plantas, algas y cianobacterias convierten CO₂ + H₂O + luz solar en glucosa + O₂. Es la base de casi toda la producción primaria en la Tierra y la fuente del O₂ atmosférico."},
{cat:"Luz, Agua & Suelo", q:"¿Qué es el punto de compensación lumínica?", a:"Intensidad de luz a la que la fotosíntesis bruta = respiración. Por encima, hay ganancia neta de carbono; por debajo, hay pérdida. Varía según la especie (plantas de sol vs. sombra)."},
{cat:"Luz, Agua & Suelo", q:"¿Qué son las plantas C3, C4 y CAM?", a:"C3: fijación de CO₂ directa (3-fosfoglicerato); ineficientes en calor seco. C4: concentran CO₂ en células del mesófilo (maíz, caña); eficientes en calor. CAM: apertura estomática nocturna (cactus, agaves); eficientes en ambientes áridos."},
{cat:"Luz, Agua & Suelo", q:"¿Cuáles son las propiedades del agua que la hacen esencial para la vida?", a:"Alta capacidad calorífica, calor de vaporización elevado, cohesión/tensión superficial, expansión al congelarse, solvente universal, polaridad. Permite termorregulación y transporte de nutrientes."},
{cat:"Luz, Agua & Suelo", q:"¿Qué es el potencial hídrico (Ψ)?", a:"Medida de la energía libre del agua en un sistema. Determina el movimiento del agua (siempre de mayor a menor potencial). Incluye componentes osmótico (Ψs) y de presión (Ψp)."},
{cat:"Luz, Agua & Suelo", q:"¿Qué son los horizontes del suelo?", a:"O (materia orgánica), A (topsoil, rica en humus), E (eluviación), B (iluviación, acumulación de minerales), C (roca madre parcialmente alterada), R (roca madre). La textura y profundidad determinan la fertilidad."},
{cat:"Luz, Agua & Suelo", q:"¿Qué es la capacidad de campo del suelo?", a:"Cantidad máxima de agua que retiene el suelo después del drenaje gravitacional. Determinada por la textura (arcillas > limos > arenas). Fundamental para la disponibilidad hídrica a las plantas."},
{cat:"Luz, Agua & Suelo", q:"¿Qué es el pH del suelo y cómo afecta a las plantas?", a:"Medida de la acidez/alcalinidad del suelo (1-14). La mayoría de plantas prefieren pH 6-7. pH bajo solubiliza Al y Mn (tóxicos); pH alto reduce disponibilidad de Fe, Mn, Zn. Afecta la comunidad microbiana."},
{cat:"Luz, Agua & Suelo", q:"¿Qué es la salinidad y cómo afecta a los organismos?", a:"Concentración de sales disueltas. Alta salinidad causa estrés osmótico (pérdida de agua por ósmosis). Las halófitas tienen adaptaciones especiales (glándulas secretoras de sal, raíces con alta presión osmótica)."},
{cat:"Luz, Agua & Suelo", q:"¿Qué es la capa límite (boundary layer) en organismos?", a:"Capa delgada de aire o agua quieta adyacente a la superficie del organismo. Reduce la transferencia de calor, agua y gases. Su grosor depende del tamaño del organismo y la velocidad del viento/agua."},

/* ─── UNIDAD 4: ADAPTACIONES DE LOS ORGANISMOS ─── */
{cat:"Adaptaciones", q:"¿Qué es una adaptación?", a:"Rasgo heredable que aumenta la aptitud (fitness) de un individuo en su ambiente. Puede ser morfológica, fisiológica o conductual. Resulta de la selección natural a lo largo de generaciones."},
{cat:"Adaptaciones", q:"¿Qué es la tolerancia y cuál es el modelo de Shelford?", a:"Rango de condiciones abióticas dentro del cual un organismo puede sobrevivir y reproducirse. La Ley de Tolerancia de Shelford establece que cada especie tiene un mínimo, óptimo y máximo para cada factor ambiental."},
{cat:"Adaptaciones", q:"¿Qué es la aclimatación vs. adaptación?", a:"Aclimatación: ajuste fisiológico reversible a corto plazo de un individuo (ej: más glóbulos rojos en altitudes). Adaptación: cambio genético hereditario a largo plazo en una población mediante selección natural."},
{cat:"Adaptaciones", q:"¿Qué es la termorregulación en ectotérmicos vs. endotérmicos?", a:"Ectotérmicos (poiquilotermos): temperatura corporal depende del ambiente (reptiles, peces, insectos). Endotérmicos (homeotérmicos): generan calor internamente y mantienen temperatura constante (mamíferos, aves)."},
{cat:"Adaptaciones", q:"¿Qué es la regla de Bergmann?", a:"Los individuos de una especie (o especies de un mismo grupo) tienden a ser más grandes en latitudes altas (climas fríos) donde la menor relación superficie/volumen reduce pérdida de calor."},
{cat:"Adaptaciones", q:"¿Qué es la regla de Allen?", a:"Los apéndices (orejas, extremidades, colas) son proporcionalmente más cortos en animales de climas fríos para reducir la pérdida de calor. Ej: zorro ártico vs. zorro del desierto."},
{cat:"Adaptaciones", q:"¿Qué adaptaciones tienen los organismos del desierto?", a:"Morfológicas: espinas, cuerpos rechonchos, raíces profundas. Fisiológicas: riñones concentradores, metabolismo CAM/C4, orina concentrada. Conductuales: actividad nocturna, estivación, guaridas."},
{cat:"Adaptaciones", q:"¿Qué es la dormancia y la diapausa?", a:"Dormancia: estado de actividad metabólica reducida en plantas (semillas, bulbos) y animales (hibernación). Diapausa: interrupción del desarrollo en insectos inducida por señales ambientales (fotoperiodo, temperatura)."},
{cat:"Adaptaciones", q:"¿Qué es el costo de la termorregulación endotérmica?", a:"Los endotérmicos gastan 10x más energía en mantenimiento que los ectotérmicos del mismo tamaño. Requieren más alimento, pero pueden estar activos en un rango mayor de temperaturas ambientales."},
{cat:"Adaptaciones", q:"¿Qué es la osmorregulación?", a:"Regulación de la concentración de solutos internos. Los organismos osmorreguladores mantienen su osmolalidad interna constante independientemente del medio. Los osmocorfos equilibran su concentración con la del medio."},

/* ─── UNIDAD 5: ECOLOGÍA DE POBLACIONES – CONCEPTOS BÁSICOS ─── */
{cat:"Poblaciones – Básico", q:"¿Qué es una población en ecología?", a:"Grupo de individuos de la misma especie que viven en la misma área al mismo tiempo y se pueden reproducir entre sí. Se caracteriza por tamaño, densidad, distribución espacial, tasas de natalidad y mortalidad."},
{cat:"Poblaciones – Básico", q:"¿Cuáles son los tres tipos de distribución espacial?", a:"1) Aleatoria: sin patrón (ej: algunas plantas). 2) Uniforme/regular: individuos equidistantes (ej: territorios, alelopatía). 3) Agrupada/contagiosa: individuos en grupos (la más común; recursos, comportamiento social)."},
{cat:"Poblaciones – Básico", q:"¿Cómo se mide la densidad de población?", a:"Densidad = número de individuos / unidad de área (o volumen). Se estima con cuadrados (cuadrantes), transectos, captura-recaptura (método de Lincoln-Petersen) o conteos directos."},
{cat:"Poblaciones – Básico", q:"¿Qué es el método de captura-recaptura (Lincoln-Petersen)?", a:"N = (M × n) / m, donde M = individuos marcados inicialmente, n = individuos en la segunda captura, m = marcados recapturados. Supone población cerrada, marcas no afectan, igual capturabilidad."},
{cat:"Poblaciones – Básico", q:"¿Qué es una tabla de vida (tabla de vida de cohorte)?", a:"Registro de supervivencia y fecundidad de una cohorte (grupo nacido al mismo tiempo). Contiene: lx (probabilidad de sobrevivir hasta edad x), mx (fecundidad a edad x), Ro (tasa neta de reproducción)."},
{cat:"Poblaciones – Básico", q:"¿Qué es Ro (tasa neta de reproducción)?", a:"Ro = Σ(lx × mx). Número promedio de hembras producidas por hembra a lo largo de su vida. Si Ro >1, la población crece; Ro =1, estable; Ro <1, decrece."},
{cat:"Poblaciones – Básico", q:"¿Qué son las curvas de supervivencia (tipos I, II, III)?", a:"Tipo I: alta supervivencia juvenil, mortalidad concentrada en edades avanzadas (ej: humanos, mamíferos grandes). Tipo II: mortalidad constante a todas las edades (ej: aves, reptiles). Tipo III: alta mortalidad juvenil, alta supervivencia en adultos (ej: peces, árboles, ostras)."},
{cat:"Poblaciones – Básico", q:"¿Qué son los organismos semelparos vs. iteróparos?", a:"Semelparos: se reproducen una sola vez y mueren (ej: salmón, agave, insectos anuales). Iteróparos: se reproducen múltiples veces a lo largo de su vida (ej: humanos, mamíferos grandes, árboles)."},

/* ─── UNIDAD 6: CRECIMIENTO POBLACIONAL ─── */
{cat:"Crecimiento Poblacional", q:"¿Qué es la tasa intrínseca de incremento natural (r)?", a:"r = tasa de natalidad per cápita – tasa de mortalidad per cápita. Mide el potencial máximo de crecimiento de una población en condiciones ideales (sin limitantes). r = ln(Ro)/G, donde G es el tiempo generacional."},
{cat:"Crecimiento Poblacional", q:"¿Qué es el crecimiento exponencial y cuándo ocurre?", a:"dN/dt = rN. Ocurre cuando los recursos son ilimitados. Produce una curva en J. Solo sostenible a corto plazo en poblaciones que colonizan nuevos hábitats o se recuperan de un evento catastrófico."},
{cat:"Crecimiento Poblacional", q:"¿Qué es el crecimiento logístico?", a:"dN/dt = rN[(K-N)/K]. La población crece en forma de S hasta alcanzar K (capacidad de carga). La tasa de crecimiento disminuye a medida que N se acerca a K por competencia intraespecífica."},
{cat:"Crecimiento Poblacional", q:"¿Qué es la capacidad de carga (K)?", a:"Tamaño máximo de población que el ambiente puede sostener de forma indefinida. Determinado por la disponibilidad de recursos (alimento, agua, espacio, refugio). K no es fijo, varía con las condiciones ambientales."},
{cat:"Crecimiento Poblacional", q:"¿Qué es el rendimiento máximo sostenible (MSY)?", a:"Máxima producción que se puede extraer de una población de manera sostenida. Ocurre cuando N = K/2, donde la tasa de crecimiento neta es máxima. Fundamental en manejo pesquero y de recursos renovables."},
{cat:"Crecimiento Poblacional", q:"¿Qué son las estrategias r y K (selección r-K)?", a:"Estrategia r: muchas crías pequeñas, baja inversión parental, alta mortalidad, ciclos de vida cortos (insectos, plantas anuales). Estrategia K: pocas crías grandes, alta inversión parental, baja mortalidad, ciclos largos (mamíferos grandes)."},
{cat:"Crecimiento Poblacional", q:"¿Qué es el λ (lambda) en dinámica de poblaciones?", a:"Tasa finita de incremento: Nt+1/Nt. λ=1: población estable; λ>1: crece; λ<1: decrece. Relacionado con r por: λ = eʳ. Se calcula a partir de matrices de proyección poblacional."},
{cat:"Crecimiento Poblacional", q:"¿Qué es el efecto Allee?", a:"Disminución de la aptitud individual cuando la densidad de población es muy baja. Causado por dificultad para encontrar pareja, menor defensa grupal, falta de facilitación. Puede llevar a la extinción si la población cae por debajo de un umbral mínimo."},
{cat:"Crecimiento Poblacional", q:"¿Qué son las matrices de Leslie?", a:"Modelos matriciales de crecimiento poblacional que dividen la población por clases de edad o estadios. Permiten calcular λ, la distribución estable de edades y la sensibilidad/elasticidad de cada parámetro vital."},
{cat:"Crecimiento Poblacional", q:"¿Qué es la demografía ecológica?", a:"Estudio cuantitativo de las tasas de nacimiento, muerte, inmigración y emigración de una población. Genera proyecciones de tamaño y estructura poblacional para manejo y conservación."},

/* ─── UNIDAD 7: REGULACIÓN POBLACIONAL ─── */
{cat:"Regulación Poblacional", q:"¿Cuál es la diferencia entre factores dependientes e independientes de la densidad?", a:"Dependientes de la densidad: su efecto aumenta con N (competencia, enfermedades, parásitos, depredación territorial). Independientes de la densidad: clima, desastres naturales; afectan igual sin importar N."},
{cat:"Regulación Poblacional", q:"¿Qué es la regulación dependiente de la densidad?", a:"Mecanismo de retroalimentación negativa que estabiliza la población alrededor de K. A mayor densidad, mayor mortalidad/menor natalidad. Mecanismos: competencia por recursos, depredación, enfermedades, estrés fisiológico."},
{cat:"Regulación Poblacional", q:"¿Qué son las oscilaciones poblacionales?", a:"Fluctuaciones cíclicas o irregulares del tamaño poblacional. Pueden ser intrínsecas (sobreutilización del alimento) o extrínsecas (clima, depredadores). Ej: ciclos de 10 años de la liebre ártica y el lince (Lepus-Lynx)."},
{cat:"Regulación Poblacional", q:"¿Qué es el ciclo de Lepus-Lynx?", a:"Ciclo de ~10 años entre la liebre ártica (Lepus americanus) y el lince canadiense (Lynx canadensis). La liebre oscila primero, el lince la sigue con un retraso. Demuestra regulación por depredación (aunque el alimento también importa)."},
{cat:"Regulación Poblacional", q:"¿Qué son las metapoblaciones?", a:"Conjunto de poblaciones locales conectadas por dispersión. Propuesto por Levins (1970). Permite la extinción local y recolonización. Dinámicas de parche-ocupación. Fundamental en fragmentación de hábitat."},
{cat:"Regulación Poblacional", q:"¿Qué es el modelo de Levins para metapoblaciones?", a:"dp/dt = mp(1-p) – ep. Donde p = fracción de parches ocupados, m = tasa de colonización, e = tasa de extinción local. Equilibrio: p* = 1 - e/m. La especie persiste globalmente si m > e."},

/* ─── UNIDAD 8: INTERACCIONES ENTRE ESPECIES I: COMPETENCIA ─── */
{cat:"Competencia", q:"¿Qué es la competencia interespecífica?", a:"Interacción (-/-) donde dos o más especies compiten por un recurso limitado (alimento, espacio, luz, agua). Puede ser por interferencia directa o por explotación indirecta del recurso."},
{cat:"Competencia", q:"¿Qué establece el principio de exclusión competitiva de Gause?", a:"Dos especies que compiten por el mismo recurso limitado no pueden coexistir indefinidamente: la mejor competidora excluye a la otra. Demostrado con Paramecium caudatum y P. aurelia."},
{cat:"Competencia", q:"¿Qué es el nicho ecológico de Hutchinson?", a:"Hipervolumen n-dimensional definido por todos los factores ambientales (ejes) dentro de los cuales una especie puede sobrevivir y reproducirse. Nicho fundamental vs. nicho realizado (restringido por competidores)."},
{cat:"Competencia", q:"¿Cuál es la diferencia entre nicho fundamental y nicho realizado?", a:"Fundamental: rango completo de condiciones en que la especie puede vivir en ausencia de competidores. Realizado: porción del nicho fundamental realmente ocupada en presencia de competidores y otras presiones."},
{cat:"Competencia", q:"¿Qué es la partición de nicho (resource partitioning)?", a:"División de recursos entre especies similares que permite su coexistencia. Reduce el solapamiento de nicho. Ejemplos: piquitos de Darwin, separación temporal, espacial o de dieta entre competidores."},
{cat:"Competencia", q:"¿Qué son las ecuaciones de Lotka-Volterra para la competencia?", a:"dN₁/dt = r₁N₁(K₁ – N₁ – α₁₂N₂)/K₁ y dN₂/dt = r₂N₂(K₂ – N₂ – α₂₁N₁)/K₂. α₁₂ = efecto de esp. 2 sobre esp. 1. Coexistencia si α₁₂ < K₁/K₂ y α₂₁ < K₂/K₁."},
{cat:"Competencia", q:"¿Qué es el desplazamiento de carácter?", a:"Divergencia de rasgos morfológicos en zonas de simpatría entre dos especies similares, reduciendo la competencia. Ej: diferencias en tamaño de pico de los piquitos de Darwin en islas compartidas vs. islas individuales."},
{cat:"Competencia", q:"¿Qué es la competencia aparente?", a:"Dos especies de presas 'compiten' indirectamente porque comparten un depredador: cuando aumenta una presa, aumenta el depredador y deprime a la otra presa, aunque no compitan directamente por recursos."},

/* ─── UNIDAD 9: INTERACCIONES: DEPREDACIÓN ─── */
{cat:"Depredación", q:"¿Qué es la depredación?", a:"Interacción (+/-) en que un organismo (depredador) mata y consume a otro (presa). Incluye carnívoros, herbívoros y omnívoros. Influye en tamaño y dinámica de poblaciones de presa y depredador."},
{cat:"Depredación", q:"¿Qué son las ecuaciones de Lotka-Volterra para depredador-presa?", a:"dN/dt = rN – aNP (presa) y dP/dt = baNP – mP (depredador). N=presa, P=depredador, a=tasa de ataque, b=eficiencia de conversión, m=tasa de mortalidad del depredador. Generan oscilaciones cíclicas neutras."},
{cat:"Depredación", q:"¿Qué son las respuestas funcionales del depredador?", a:"Tipo I: consumo lineal con densidad de presa (planctón filtradores). Tipo II: curva de saturación (cada presa requiere manejo; más común). Tipo III: sigmoidal (búsqueda imagen-de-presa, aprendizaje; estabilizante)."},
{cat:"Depredación", q:"¿Qué es la respuesta numérica del depredador?", a:"Cambio en el número de depredadores en respuesta a la densidad de presa. Puede ser por reproducción (respuesta numérica funcional) o por agregación (movimiento de depredadores hacia zonas con más presas)."},
{cat:"Depredación", q:"¿Qué son las adaptaciones antipredatorias?", a:"Camuflaje (cripsis), mimetismo (Batesiano/Mülleriano), coloración aposemática, conductas de escape, formación de grupos (efecto de dilución), espinas/toxinas, señales de alarma."},
{cat:"Depredación", q:"¿Qué es el mimetismo Batesiano?", a:"Especie inofensiva (mímica) imita la coloración aposemática de una especie tóxica (modelo). El depredador aprende a evitar al modelo y, por asociación, también a la mímica. Funciona solo si el mímica es raro."},
{cat:"Depredación", q:"¿Qué es el mimetismo Mülleriano?", a:"Dos o más especies tóxicas o peligrosas comparten la misma señal de advertencia (coloración, patrón). Se benefician mutuamente porque los depredadores aprenden más rápido a evitar la señal compartida."},
{cat:"Depredación", q:"¿Qué es una cascada trófica?", a:"Efectos indirectos de un depredador superior sobre niveles tróficos inferiores. Ej: depredadores → reducen herbívoros → aumenta vegetación (cascada trófica descendente). Demostrado con lobos en Yellowstone."},
{cat:"Depredación", q:"¿Qué son las carreras armamentistas coevolutivas?", a:"Evolución recíproca entre depredador y presa (o parásito y huésped): mejoras en ataque del predador generan selección para mejor defensa en la presa, y viceversa. Proceso continuo de coevolución."},

/* ─── UNIDAD 10: INTERACCIONES: PARASITISMO Y ENFERMEDAD ─── */
{cat:"Parasitismo & Enfermedad", q:"¿Qué es el parasitismo?", a:"Interacción (+/-) donde el parásito vive en o sobre el huésped, obteniendo nutrientes a su costo. El parásito raramente mata directamente al huésped (a diferencia del depredador). Incluye ectoparásitos e endoparásitos."},
{cat:"Parasitismo & Enfermedad", q:"¿Qué son los parásitoides?", a:"Organismos que viven dentro del huésped durante su desarrollo (como parásitos) pero lo matan al final (como depredadores). Principalmente avispas y moscas. Ampliamente usados en control biológico."},
{cat:"Parasitismo & Enfermedad", q:"¿Qué es el modelo SIR de epidemiología?", a:"Clasifica a individuos en Susceptibles (S), Infectados/Infecciosos (I) y Recuperados/Resistentes (R). Número básico de reproducción R₀ = β/(γ+μ). Si R₀>1, epidemia se propaga."},
{cat:"Parasitismo & Enfermedad", q:"¿Qué es R₀ (número básico de reproducción)?", a:"Número promedio de nuevas infecciones que causa un individuo infectado en una población completamente susceptible. R₀>1: la enfermedad se propaga. R₀<1: se extingue. Umbral de inmunidad de rebaño: 1 – 1/R₀."},
{cat:"Parasitismo & Enfermedad", q:"¿Cómo afectan los parásitos a las poblaciones de huéspedes?", a:"Aumentan mortalidad, reducen fecundidad, debilitan el sistema inmune, aumentan vulnerabilidad a depredadores. Pueden regular poblaciones y mantener diversidad (hipótesis del Mundo Rojo/Red Queen)."},
{cat:"Parasitismo & Enfermedad", q:"¿Qué es la hipótesis de la Reina Roja?", a:"La coevolución entre parásito y huésped favorece la reproducción sexual porque genera nuevas combinaciones genéticas que el parásito no ha encontrado. Explica la alta frecuencia de reproducción sexual."},

/* ─── UNIDAD 11: INTERACCIONES: MUTUALISMO Y COMENSALISMO ─── */
{cat:"Mutualismo & Comensalismo", q:"¿Qué es el mutualismo?", a:"Interacción (+/+) beneficiosa para ambas especies. Puede ser obligado (ninguna puede sobrevivir sin la otra, ej: líquenes, micorrizas) o facultativo (mejora la aptitud pero no es esencial)."},
{cat:"Mutualismo & Comensalismo", q:"¿Qué son las micorrizas?", a:"Simbiosis mutualista entre hongos y raíces de plantas. El hongo aumenta la absorción de agua y fósforo; la planta proporciona carbono. Presentes en >90% de las plantas terrestres. Tipos: ectomicorrizas y endomicorrizas (arbusculares)."},
{cat:"Mutualismo & Comensalismo", q:"¿Qué es la simbiosis rizobio-leguminosa?", a:"Bacterias del género Rhizobium infectan raíces de leguminosas y forman nódulos. Fijan N₂ atmosférico convirtiéndolo en NH₄⁺ (asimilable). La planta proporciona carbohidratos. Fundamental para el ciclo del nitrógeno."},
{cat:"Mutualismo & Comensalismo", q:"¿Qué son los polinizadores y la polinización?", a:"Animales (abejas, mariposas, aves, murciélagos) que transportan polen de flor en flor mientras buscan néctar. Interacción mutualista que facilita la reproducción sexual de las plantas con flor (~80% angiospermas)."},
{cat:"Mutualismo & Comensalismo", q:"¿Qué es la dispersión de semillas por animales (zoocoria)?", a:"Animales transportan semillas alejándolas de la planta madre (endozoocoria: en el intestino; epizoocoria: adheridas al exterior). Beneficia a la planta (dispersión) y al animal (alimento)."},
{cat:"Mutualismo & Comensalismo", q:"¿Qué es el comensalismo?", a:"Interacción (+/0) donde una especie se beneficia y la otra no se beneficia ni se perjudica. Ej: epifitas sobre árboles, peces piloto junto a tiburones, buitres y leones (el buitre se beneficia de los restos)."},
{cat:"Mutualismo & Comensalismo", q:"¿Qué son los líquenes?", a:"Simbiosis mutualista entre un hongo (proporciona protección y agua) y un alga verde o cianobacteria (proporciona carbono por fotosíntesis). Organismos pioneros en la sucesión primaria."},

/* ─── UNIDAD 12: COMUNIDADES ECOLÓGICAS ─── */
{cat:"Comunidades", q:"¿Qué es una comunidad ecológica?", a:"Conjunto de poblaciones de diferentes especies que coexisten en un mismo lugar y tiempo. Las interacciones entre ellas (competencia, depredación, mutualismo) generan patrones de diversidad, estructura y dinámica."},
{cat:"Comunidades", q:"¿Qué es la diversidad de especies (alfa, beta, gamma)?", a:"Alfa (α): diversidad dentro de un hábitat (riqueza + equitatividad). Beta (β): diferencia en composición de especies entre hábitats (recambio). Gamma (γ): diversidad total en una región (α × β)."},
{cat:"Comunidades", q:"¿Qué es el índice de Shannon-Wiener (H')?", a:"H' = -Σpᵢ ln(pᵢ). Mide la diversidad combinando riqueza y equitatividad. Mayor H' cuando hay más especies y distribución equitativa de individuos. Sensible a la riqueza y a la uniformidad."},
{cat:"Comunidades", q:"¿Qué es el índice de Simpson?", a:"D = Σpᵢ². Probabilidad de que dos individuos elegidos al azar pertenezcan a la misma especie. Se usa como 1-D o 1/D. Más sensible a las especies dominantes que el índice de Shannon."},
{cat:"Comunidades", q:"¿Qué es la equitatividad (evenness)?", a:"Distribución de la abundancia entre las especies de una comunidad. Máxima cuando todas las especies tienen la misma abundancia. Se mide como J' = H'/H'max (Pielou). Va de 0 a 1."},
{cat:"Comunidades", q:"¿Qué es la hipótesis del disturbio intermedio (IDH)?", a:"La diversidad de especies es máxima a niveles intermedios de disturbio. Disturbios bajos: especies dominantes excluyen a otras. Disturbios altos: pocas especies toleran. Propuesta por Connell (1978)."},
{cat:"Comunidades", q:"¿Qué es una especie clave (keystone species)?", a:"Especie cuya influencia sobre la comunidad es desproporcionadamente grande para su abundancia relativa. Su eliminación causa cambios dramáticos en la estructura de la comunidad. Ej: nutria marina, lobo, higuera."},
{cat:"Comunidades", q:"¿Qué es una especie ingeniería del ecosistema?", a:"Especie que modifica físicamente el hábitat, creando o manteniendo condiciones para otras especies. Ej: castores (represas), elefantes (claros), árboles caídos por pájaros carpinteros."},
{cat:"Comunidades", q:"¿Qué son las redes tróficas (food webs)?", a:"Representación de las relaciones alimentarias en una comunidad. Incluyen productores, consumidores primarios, secundarios, terciarios y descomponedores. Las redes complejas pueden ser más estables."},
{cat:"Comunidades", q:"¿Qué son los gremios en ecología?", a:"Grupo de especies que explotan el mismo tipo de recurso de manera similar. Ej: gremio de insectívoros aéreos. Facilita el análisis de competencia y la partición de recursos sin conocer taxonomía."},

/* ─── UNIDAD 13: SUCESIÓN ECOLÓGICA ─── */
{cat:"Sucesión", q:"¿Qué es la sucesión ecológica?", a:"Proceso de cambio direccional en la composición y estructura de una comunidad a lo largo del tiempo. Resulta de la modificación del hábitat por los propios organismos y las respuestas diferenciales de las especies."},
{cat:"Sucesión", q:"¿Cuál es la diferencia entre sucesión primaria y secundaria?", a:"Primaria: ocurre en áreas sin suelo ni biota previa (roca volcánica, dunas nuevas, glaciares). Secundaria: en áreas perturbadas donde queda suelo y bancos de semillas (tala, incendios, campos abandonados). La secundaria es más rápida."},
{cat:"Sucesión", q:"¿Qué son las especies pioneras?", a:"Primeras especies en colonizar un área en sucesión primaria. Toleran condiciones extremas (poca agua, temperatura, nutrientes). Modifican el ambiente para facilitar la llegada de otras especies. Ej: líquenes, musgos, plantas anuales."},
{cat:"Sucesión", q:"¿Qué es el clímax en sucesión ecológica?", a:"Estado final teórico de la sucesión, donde la comunidad está en equilibrio con el ambiente. Concepto cuestionado: muchas comunidades son dinámicas y no alcanzan un estado estable. El 'clímax' es relativo al régimen de disturbios."},
{cat:"Sucesión", q:"¿Cuáles son los mecanismos de sucesión de Connell y Slatyer?", a:"1) Facilitación: especies tempranas mejoran el hábitat para las tardías. 2) Tolerancia: especies tardías toleran peores condiciones, reemplazan lentamente. 3) Inhibición: especies establecidas resisten la invasión (sucesión aleatoria)."},
{cat:"Sucesión", q:"¿Qué es la cronosecuencia?", a:"Comparación de comunidades en diferentes estadios sucesionales para inferir el proceso de sucesión, usando sitios de distinta edad como réplicas temporales (asume que el mismo proceso ocurrirá en todos)."},
{cat:"Sucesión", q:"¿Cómo contribuyen los organismos a la formación del suelo durante la sucesión primaria?", a:"Los pioneros (líquenes, musgos) atacan la roca con ácidos, acumulan materia orgánica. Con el tiempo se forma humus, mejoran la retención de agua y nutrientes, permitiendo colonización de plantas más exigentes."},

/* ─── UNIDAD 14: ESTRUCTURA TRÓFICA Y FLUJO DE ENERGÍA ─── */
{cat:"Energía & Tróficos", q:"¿Qué es la producción primaria bruta (GPP)?", a:"Total de energía fotosintética fijada por los productores por unidad de área y tiempo. GPP = NPP + Ra, donde Ra es la respiración autotrófica. Se mide en g C m⁻² año⁻¹ o kcal m⁻² año⁻¹."},
{cat:"Energía & Tróficos", q:"¿Qué es la producción primaria neta (NPP)?", a:"NPP = GPP – Ra. Energía disponible para los consumidores primarios (herbívoros). Varía con bioma: mayor en selvas tropicales (~2200 g C m⁻² año⁻¹), menor en desiertos y tundra (~25 g C m⁻² año⁻¹)."},
{cat:"Energía & Tróficos", q:"¿Qué limita la productividad primaria en ecosistemas terrestres?", a:"Principalmente temperatura y precipitación (correlación del índice de evapotranspiración real, AET, con NPP). También nutrientes (N, P limitantes en muchos ecosistemas)."},
{cat:"Energía & Tróficos", q:"¿Qué limita la productividad primaria en ecosistemas acuáticos?", a:"Principalmente nutrientes (N, P) y luz. En el océano abierto: N o Fe limitan. En lagos: P generalmente limita. La luz penetra solo hasta la zona fótica."},
{cat:"Energía & Tróficos", q:"¿Qué es la eficiencia ecológica (regla del 10%)?", a:"Aproximadamente el 10% de la energía de un nivel trófico se transfiere al siguiente (eficiencia trófica). El 90% se pierde como calor en la respiración, excreción y partes no consumidas. Limita la longitud de las cadenas tróficas."},
{cat:"Energía & Tróficos", q:"¿Qué es la pirámide ecológica?", a:"Representación de biomasa, energía o número de individuos en cada nivel trófico. Las pirámides de energía siempre tienen forma piramidal (ley termodinámica). Las de biomasa pueden invertirse (ocean plankton vs. zooplankton)."},
{cat:"Energía & Tróficos", q:"¿Cuántos niveles tróficos puede sostener una cadena alimentaria?", a:"Generalmente 4-5 niveles. Las pérdidas de energía (~90%) en cada transferencia limitan la longitud. Ecosistemas de alta productividad pueden sostener más niveles. La estabilidad también puede limitar cadenas muy largas."},
{cat:"Energía & Tróficos", q:"¿Qué son los descomponedores y detritívoros?", a:"Descomponedores (bacterias, hongos): descomponen materia orgánica muerta liberando nutrientes minerales. Detritívoros (lombrices, milpiés, cangrejos): fragmentan la materia orgánica. Esenciales para el reciclaje de nutrientes."},
{cat:"Energía & Tróficos", q:"¿Qué es la vía de los detritos (detrital pathway)?", a:"Ruta energética donde la materia orgánica muerta (detritos) es consumida por descomponedores y detritívoros. En muchos ecosistemas (bosques templados, humedales) procesa más energía que la vía del pastoreo."},

/* ─── UNIDAD 15: CICLOS BIOGEOQUÍMICOS ─── */
{cat:"Ciclos Biogeoquímicos", q:"¿Qué es un ciclo biogeoquímico?", a:"Movimiento cíclico de un elemento entre componentes bióticos (organismos) y abióticos (atmósfera, litósfera, hidrosfera). Incluye fases de asimilación, transformación y mineralización. Fundamentales para el funcionamiento ecosistémico."},
{cat:"Ciclos Biogeoquímicos", q:"¿Cuáles son los procesos clave del ciclo del carbono?", a:"Fotosíntesis (captura CO₂), respiración (libera CO₂), descomposición, combustión de fósiles, meteorización, formación de carbonatos. Equilibrio entre fuentes (emisiones) y sumideros (bosques, océanos)."},
{cat:"Ciclos Biogeoquímicos", q:"¿Cuáles son los procesos del ciclo del nitrógeno?", a:"Fijación (N₂→NH₄⁺ por bacterias), nitrificación (NH₄⁺→NO₂⁻→NO₃⁻), asimilación (plantas absorben NO₃⁻), amonificación (descomposición → NH₄⁺), desnitrificación (NO₃⁻→N₂). Fijación biológica por Rhizobium, Azotobacter, cianobacterias."},
{cat:"Ciclos Biogeoquímicos", q:"¿Cuáles son los procesos del ciclo del fósforo?", a:"Meteorización de rocas fosfáticas, absorción por plantas, consumo por animales, descomposición, sedimentación. No tiene fase gaseosa atmosférica significativa (ciclo sedimentario). El P es nutriente limitante frecuente."},
{cat:"Ciclos Biogeoquímicos", q:"¿Cuáles son los procesos del ciclo del agua (ciclo hidrológico)?", a:"Evaporación, transpiración (evapotranspiración), condensación, precipitación, escorrentía, infiltración, percolación, flujo subterráneo. Las plantas regulan el ciclo terrestre mediante la transpiración."},
{cat:"Ciclos Biogeoquímicos", q:"¿Qué es la eutrofización?", a:"Enriquecimiento excesivo de un cuerpo de agua con nutrientes (principalmente N y P), causando proliferación de algas (bloom algal), reducción del O₂ disuelto (hipoxia/anoxia) y pérdida de biodiversidad. Causada por agricultura, aguas residuales."},
{cat:"Ciclos Biogeoquímicos", q:"¿Qué es la lluvia ácida?", a:"Precipitación con pH < 5.6 causada por SO₂ y NOₓ emitidos por combustión de fósiles que forman H₂SO₄ y HNO₃ en la atmósfera. Daña bosques, acidifica lagos (reduce pH y biodiversidad acuática), corroe edificios."},
{cat:"Ciclos Biogeoquímicos", q:"¿Qué es la mineralización?", a:"Proceso de descomposición de materia orgánica que libera nutrientes inorgánicos (NH₄⁺, PO₄³⁻, SO₄²⁻) disponibles para las plantas. Realizada por bacterias y hongos descomponedores."},

/* ─── UNIDAD 16: ECOSISTEMAS TERRESTRES – BIOMAS ─── */
{cat:"Biomas Terrestres", q:"¿Qué es un bioma?", a:"Región geográfica extensa con vegetación y fauna características, determinada principalmente por el clima (temperatura y precipitación). Los biomas son la unidad de análisis a escala global en ecología."},
{cat:"Biomas Terrestres", q:"¿Qué caracteriza a la selva tropical lluviosa?", a:"Alta temperatura constante (>25°C), precipitación >2000 mm/año, alta diversidad (>50% especies terrestres), estratificación vertical, suelos pobres (oligotróficos), dosel cerrado, alta NPP (~1800-2200 g C m⁻² año⁻¹)."},
{cat:"Biomas Terrestres", q:"¿Qué caracteriza al bosque tropical caducifolio (sabana)?", a:"Estación seca pronunciada, árboles que pierden hojas en la seca, precipitación 1000-2000 mm/año concentrada. Alta productividad. Fuegos periódicos importantes."},
{cat:"Biomas Terrestres", q:"¿Qué es la sabana y qué la caracteriza?", a:"Bioma tropical/subtropical con mezcla de pastos y árboles dispersos, estación seca pronunciada. Fuego e herbívoros grandes (elefantes, jirafas, cebras) mantienen la estructura. Precipitación 500-1500 mm/año."},
{cat:"Biomas Terrestres", q:"¿Qué caracteriza al desierto?", a:"Precipitación <250 mm/año, alta variabilidad, temperaturas extremas. Baja densidad de organismos, alta especialización. Adaptaciones: dormancia, actividad nocturna, eficiencia hídrica, suculencia."},
{cat:"Biomas Terrestres", q:"¿Qué es el chaparral (matorral mediterráneo)?", a:"Bioma con veranos secos e inviernos suaves y lluviosos (clima mediterráneo). Vegetación densa de arbustos esclerófilos (hojas duras). Alta diversidad de plantas. Fuego parte del ciclo natural. Peligro de incendios antrópicos."},
{cat:"Biomas Terrestres", q:"¿Qué caracteriza al pastizal (pradera) templado?", a:"Precipitación intermedia (250-750 mm/año), temperatura variable, dominio de gramíneas. Sin árboles por sequía e incendios. Suelos ricos en materia orgánica (mollisoles). Gran productividad agropecuaria (ej: Pampas, Great Plains)."},
{cat:"Biomas Terrestres", q:"¿Qué es la taiga (bosque boreal)?", a:"Bioma más extenso del mundo (Rusia, Canadá). Coníferas (pinos, abetos, alerces). Inviernos largos y fríos, veranos cortos. Suelos ácidos (podosoles). Permafrost en algunas zonas. Baja diversidad pero alta biomasa."},
{cat:"Biomas Terrestres", q:"¿Qué es la tundra?", a:"Bioma polar/subpolar sin árboles. Vegetación baja (musgos, líquenes, graminoides). Permafrost (~30 cm profundidad), temporada de crecimiento corta (<60 días), precipitación baja (<250 mm). Vulnerable al cambio climático."},
{cat:"Biomas Terrestres", q:"¿Qué caracteriza al bosque templado caducifolio?", a:"Árboles que pierden hojas en invierno (robles, hayas, arces). Cuatro estaciones marcadas. Precipitación 750-1500 mm/año. Suelos ricos. Alta diversidad en primavera (plantas de sotobosque). Ampliamente fragmentado."},

/* ─── UNIDAD 17: ECOSISTEMAS ACUÁTICOS ─── */
{cat:"Ecosistemas Acuáticos", q:"¿Cuáles son las principales zonas de un lago?", a:"Litoral: zona costera somera, alta productividad, rica en macrofitas. Limnética: zona pelágica, fitoplancton y zooplancton. Profunda (profundal): poca o nula luz, descomposición, anoxia. Béntica: fondo del lago."},
{cat:"Ecosistemas Acuáticos", q:"¿Qué es la estratificación térmica de los lagos?", a:"En verano: epilimnion (cálido, mezclado), termoclina (gradiente brusco), hipolimnion (frío, estable). En otoño la mezcla (turnover) iguala temperaturas. En invierno: agua más fría arriba (4°C más densa en fondo)."},
{cat:"Ecosistemas Acuáticos", q:"¿Qué son los lagos oligotróficos vs. eutróficos?", a:"Oligotróficos: pocos nutrientes, agua clara, alta O₂, baja productividad, alta diversidad de peces de fondo. Eutróficos: ricos en nutrientes, alta turbidez, baja O₂, alta productividad de algas, peces adaptados a baja O₂."},
{cat:"Ecosistemas Acuáticos", q:"¿Qué caracteriza a los ríos y arroyos?", a:"Ecosistemas lóticos (agua que fluye). Corriente unidireccional, alta oxigenación. Concepto de río continuo: gradiente de condiciones desde cabecera (fría, estrecha) hasta desembocadura (cálida, amplia, sedimentosa)."},
{cat:"Ecosistemas Acuáticos", q:"¿Qué son los humedales y por qué son importantes?", a:"Ecosistemas de transición tierra-agua: pantanos, ciénagas, manglares, marismas. Servicios: purificación del agua, control de inundaciones, secuestro de carbono, hábitat para biodiversidad, cría de peces. Alta productividad."},
{cat:"Ecosistemas Acuáticos", q:"¿Qué zonas tiene el océano?", a:"Zona nerítica (plataforma continental, somera), zona oceánica (mar abierto). Vertical: zona fótica (luz suficiente para fotosíntesis, 0-200 m), afótica (oscura). Béntica: litoral, sublitoral, batial, abisal, hadal."},
{cat:"Ecosistemas Acuáticos", q:"¿Qué son las zonas de surgencia (upwelling)?", a:"Áreas donde vientos costeros mueven el agua superficial mar adentro, haciendo ascender agua fría y rica en nutrientes. Altísima productividad (ej: Perú, Benguela). Sustentan importantes pesquerías mundiales."},
{cat:"Ecosistemas Acuáticos", q:"¿Qué son los arrecifes de coral?", a:"Ecosistemas marinos formados por corales (cnidarios con zooxantelas, algas simbióticas). Alta biodiversidad (~25% de especies marinas). Sensibles al blanqueamiento (estrés térmico → expulsión de zooxantelas → coral muere)."},
{cat:"Ecosistemas Acuáticos", q:"¿Qué son los manglares?", a:"Bosques costeros tropicales/subtropicales de plantas tolerantes a la sal. Crían peces y crustáceos, protegen costas, secuestran carbono. Amenazados por deforestación para acuicultura, turismo y desarrollo costero."},

/* ─── UNIDAD 18: BIOGEOGRAFÍA ─── */
{cat:"Biogeografía", q:"¿Qué es la biogeografía?", a:"Estudio de la distribución geográfica de los organismos (actual e histórica) y los procesos que la determinan: evolución, dispersión, vicarianza, extinción, colonización. Une ecología, evolución y geología."},
{cat:"Biogeografía", q:"¿Qué es la teoría de biogeografía de islas (MacArthur & Wilson, 1967)?", a:"El número de especies en una isla es el equilibrio entre inmigración y extinción. S aumenta con área (más hábitats, refugio) y disminuye con distancia al continente (menos inmigración). Funda la ecología del paisaje."},
{cat:"Biogeografía", q:"¿Qué es la relación especie-área?", a:"S = cAᶻ (o log S = log c + z log A). Número de especies aumenta con el área. Z ≈ 0.1-0.4. Más especies en islas o fragmentos más grandes. Fundamental para diseño de reservas naturales (SLOSS debate)."},
{cat:"Biogeografía", q:"¿Qué son los gradientes latitudinales de diversidad?", a:"La riqueza de especies generalmente aumenta del polo al ecuador. Hipótesis: mayor energía solar, mayor estabilidad climática histórica, mayor área tropical, mayor complejidad de hábitats, mayor velocidad de especiación."},
{cat:"Biogeografía", q:"¿Qué es la vicarianza?", a:"Separación geográfica de una población ancestral por una barrera (montaña, mar, glaciar) que lleva a la especiación alopátrica. Es el principal motor de la distribución disyunta de grupos relacionados."},
{cat:"Biogeografía", q:"¿Qué es la dispersión en biogeografía?", a:"Movimiento de organismos a nuevas áreas cruzando barreras. Puede ser activa (vuelo, nado) o pasiva (viento, corrientes, rafting). Explica distribuciones de islas oceánicas y poblaciones en parches aislados."},
{cat:"Biogeografía", q:"¿Cuáles son las principales regiones biogeográficas del mundo?", a:"Neártica, Paleártica, Neotropical, Afrotropical (Etíope), Oriental (Indomalaya), Australiana (Australásica), Antártica. Cada una tiene fauna y flora características resultado de su historia evolutiva y geológica."},

/* ─── UNIDAD 19: CONSERVACIÓN Y ECOLOGÍA APLICADA ─── */
{cat:"Conservación", q:"¿Qué es la biodiversidad y por qué importa?", a:"Variedad de vida a nivel genético, de especies y de ecosistemas. Importa por: servicios ecosistémicos (provisión, regulación, culturales), valor intrínseco, reservorio genético para medicina y agricultura, resiliencia ecosistémica."},
{cat:"Conservación", q:"¿Cuáles son las principales amenazas para la biodiversidad (acrónimo HIPPO)?", a:"H: pérdida de Hábitat. I: Invasión de especies exóticas. P: Polución. P: crecimiento de Población humana. O: Sobreexplotación (Overharvesting). La pérdida de hábitat es la principal amenaza global."},
{cat:"Conservación", q:"¿Qué es la fragmentación del hábitat?", a:"División de hábitat continuo en parches más pequeños y aislados. Reduce el tamaño efectivo de las poblaciones, aumenta el efecto de borde, dificulta la dispersión y el flujo génico. Principal causa de extinción actual."},
{cat:"Conservación", q:"¿Qué es el efecto de borde?", a:"Cambios en las condiciones ambientales y composición de especies en la frontera entre dos hábitats (ecotono). La fragmentación aumenta la proporción de borde, afectando negativa a las especies del interior del parche."},
{cat:"Conservación", q:"¿Qué es una especie invasora?", a:"Especie introducida en un área fuera de su rango natural que prolifera, se dispersa y causa daño económico o ecológico. Sin depredadores naturales, puede desplazar especies nativas. Ej: rata negra, conejos en Australia, kudzu."},
{cat:"Conservación", q:"¿Qué es el cambio climático y cómo afecta a la biodiversidad?", a:"Alteración del clima global por aumento de GEI (principalmente CO₂) desde la Revolución Industrial. Efectos: desplazamiento de rangos hacia polos/altitudes, desincronización fenológica, bleaching de corales, deshielo del permafrost."},
{cat:"Conservación", q:"¿Qué es la biología de la conservación?", a:"Ciencia aplicada que estudia y trata de mitigar la pérdida de biodiversidad. Usa conocimiento ecológico, genético y socioeconómico. Objetivos: proteger especies, restaurar hábitats, gestionar paisajes."},
{cat:"Conservación", q:"¿Qué son las áreas protegidas (APs)?", a:"Zonas con gestión especial para proteger la biodiversidad: reservas, parques nacionales, corredores biológicos. Cubren ~15% de tierra y ~7% de océanos. Efectividad depende de tamaño, conectividad y manejo."},
{cat:"Conservación", q:"¿Qué es la restauración ecológica?", a:"Proceso de asistir la recuperación de ecosistemas degradados, dañados o destruidos. Incluye reforestación, reintroducción de especies, manejo del fuego, control de invasoras. Meta: volver al estado de referencia histórico."},
{cat:"Conservación", q:"¿Qué son los servicios ecosistémicos?", a:"Beneficios que los ecosistemas proporcionan a las personas. Tipos: Provisión (alimentos, agua, madera), Regulación (clima, inundaciones, purificación), Culturales (recreación, espiritual, estético), Soporte (ciclo de nutrientes, formación de suelo)."},
{cat:"Conservación", q:"¿Qué es la mínima área viable de población (MVP)?", a:"Tamaño mínimo de una población con >99% de probabilidad de persistir ≥1000 años. Determinado por análisis de viabilidad poblacional (PVA). Considera estocasticidad demográfica, ambiental, genética y catástrofes."},
{cat:"Conservación", q:"¿Qué es la depresión endogámica?", a:"Reducción de la aptitud en poblaciones pequeñas debida al aumento de la homocigosis y la expresión de alelos deletéreos recesivos. Amenaza principal en poblaciones muy pequeñas de especies en peligro."},

/* ─── UNIDAD 20: ECOLOGÍA DEL PAISAJE ─── */
{cat:"Paisaje & Escala", q:"¿Qué es la ecología del paisaje?", a:"Rama de la ecología que estudia las interacciones entre los patrones espaciales del paisaje y los procesos ecológicos a escalas de km². Integra ecología, geografía y uso del suelo. Clave para conservación y planificación."},
{cat:"Paisaje & Escala", q:"¿Qué es la conectividad del paisaje?", a:"Grado en que el paisaje facilita o dificulta el movimiento de organismos entre parches de hábitat. Alta conectividad favorece metapoblaciones, flujo génico y recuperación tras extinción local. Corredores biológicos mejoran la conectividad."},
{cat:"Paisaje & Escala", q:"¿Qué es un corredor biológico?", a:"Franja de hábitat que conecta parches aislados, permitiendo el movimiento de animales, dispersión de semillas y flujo génico. Contrarresta la fragmentación. Eficacia varía según especie y ancho del corredor."},
{cat:"Paisaje & Escala", q:"¿Qué es la heterogeneidad del hábitat?", a:"Variación espacial en las condiciones ambientales y el tipo de hábitat a través del paisaje. Mayor heterogeneidad generalmente implica más nichos y mayor biodiversidad (hipótesis de heterogeneidad de hábitat)."},
{cat:"Paisaje & Escala", q:"¿Qué es el ecotono?", a:"Zona de transición entre dos comunidades o ecosistemas adyacentes. Suele tener características mixtas y puede albergar mayor diversidad que los hábitats adyacentes (efecto de borde positivo para algunas especies)."},

/* ─── UNIDAD 21: CAMBIO GLOBAL ─── */
{cat:"Cambio Global", q:"¿Qué es el efecto invernadero?", a:"Proceso natural en que los gases atmosféricos (CO₂, CH₄, N₂O, H₂O) absorben la radiación infrarroja emitida por la Tierra y la re-emiten, calentando la atmósfera. El aumento antrópico de GEI intensifica este efecto."},
{cat:"Cambio Global", q:"¿Cuáles son los principales gases de efecto invernadero (GEI)?", a:"CO₂ (combustión de fósiles, deforestación), CH₄ (ganadería, arrozales, gasoductos), N₂O (agricultura, fertilizantes), HFCs/PFCs (refrigerantes), O₃ troposférico. CO₂ es el más abundante; CH₄ tiene mayor poder de calentamiento."},
{cat:"Cambio Global", q:"¿Qué es la desertificación?", a:"Degradación de tierras en zonas áridas, semiáridas y subhúmedas por variación climática y actividades humanas (sobrepastoreo, deforestación, riego inadecuado). Pérdida de vegetación, erosión del suelo, reducción de NPP."},
{cat:"Cambio Global", q:"¿Qué es la acidificación de los océanos?", a:"Disminución del pH oceánico por absorción de CO₂ atmosférico que forma H₂CO₃ (ácido carbónico). Reduce la disponibilidad de CaCO₃ para corales, moluscos y pterópodos. pH ha bajado de 8.2 a 8.1 (aumento 26% en [H⁺])."},
{cat:"Cambio Global", q:"¿Qué es la fenología y cómo la afecta el cambio climático?", a:"Estudio del tiempo de los eventos biológicos cíclicos (floración, migración, reproducción). El calentamiento adelanta la primavera y los eventos fenológicos. La desincronía trófica (mismatch) reduce la aptitud de los organismos."},
{cat:"Cambio Global", q:"¿Qué son los refugios climáticos?", a:"Áreas donde el clima local permite la persistencia de especies mientras su rango general se ve afectado por el cambio climático. Montañas, valles y costas pueden actuar como refugios para muchas especies."},

/* ─── UNIDAD 22: EVOLUCIÓN Y ECOLOGÍA ─── */
{cat:"Evolución & Ecología", q:"¿Qué es la selección natural y cómo se relaciona con la ecología?", a:"Proceso por el que los individuos con rasgos que aumentan la supervivencia y reproducción en su ambiente dejan más descendientes. La ecología define el 'ambiente' que selecciona: recursos, depredadores, clima, competidores."},
{cat:"Evolución & Ecología", q:"¿Qué es la aptitud (fitness)?", a:"Contribución relativa de un individuo a la siguiente generación, medida como el número de descendientes que sobreviven y se reproducen. Incluye aptitud directa (propia reproducción) e indirecta (parentesco, selección de parientes)."},
{cat:"Evolución & Ecología", q:"¿Qué es la coevolución?", a:"Evolución recíproca entre dos o más especies que interactúan estrechamente. Ej: polinizadores-flores (morfología complementaria), parásito-huésped (resistencia vs. virulencia), depredador-presa (velocidad, defensas)."},
{cat:"Evolución & Ecología", q:"¿Qué es la especiación alopátrica vs. simpátrica?", a:"Alopátrica: especiación por separación geográfica de poblaciones (el mecanismo más común). Simpátrica: especiación sin barrera geográfica, por poliploidía, ecotipo, selección disruptiva o diferenciación de nicho."},
{cat:"Evolución & Ecología", q:"¿Qué es la ecología evolutiva?", a:"Campo que integra ecología y biología evolutiva. Estudia cómo los procesos ecológicos (competencia, depredación, factores abióticos) moldean la evolución de rasgos de historia de vida, comportamiento y morfología."},
{cat:"Evolución & Ecología", q:"¿Qué es la teoría de la historia de vida?", a:"Estudio de cómo la selección natural moldea los rasgos del ciclo de vida: edad de madurez, número de crías, inversión parental, longevidad. Implica compromisos (trade-offs) entre reproducción actual y supervivencia futura."},
{cat:"Evolución & Ecología", q:"¿Qué es el trade-off reproducción-supervivencia?", a:"Compromisos evolutivos: mayor inversión en reproducción actual reduce la supervivencia futura y viceversa. Las condiciones ambientales (riesgo de mortalidad, disponibilidad de recursos) moldean estos compromisos adaptativos."},
{cat:"Evolución & Ecología", q:"¿Qué es la selección sexual?", a:"Forma de selección natural basada en la competencia por parejas. Selección intrasexual (competencia entre mismo sexo, ej: combates) e intersexual (elección de pareja). Favorece caracteres secundarios extravagantes (plumas del pavo real)."},

/* ─── UNIDAD 23: ECOLOGÍA DEL COMPORTAMIENTO ─── */
{cat:"Comportamiento", q:"¿Qué es la teoría del forrajeo óptimo?", a:"Modelos que predicen cómo los animales deberían elegir qué presas/parches explotar para maximizar la ingesta neta de energía. Predice que seleccionarán la dieta que maximice la energía neta/tiempo invertido."},
{cat:"Comportamiento", q:"¿Qué es el modelo de parche de forrajeo?", a:"Los animales deben decidir cuánto tiempo permanecer en un parche de recursos. El teorema del valor marginal: el animal abandona el parche cuando su tasa de ingesta baja al promedio del ambiente. Óptimo depende de la distancia entre parches."},
{cat:"Comportamiento", q:"¿Qué es el comportamiento territorial?", a:"Defensa activa de un área contra individuos de la misma u otras especies. El territorio provee recursos (alimento, pareja, espacio de cría). Evolutivamente favorecido cuando los beneficios superen los costos de defensa."},
{cat:"Comportamiento", q:"¿Qué es la selección de parientes (kin selection)?", a:"Favorece conductas altruistas hacia parientes porque al compartir genes, aumenta la aptitud inclusiva. Fórmula de Hamilton: rB > C (donde r=coeficiente de parentesco, B=beneficio al receptor, C=costo al actor)."},
{cat:"Comportamiento", q:"¿Qué es la aptitud inclusiva?", a:"Éxito reproductivo directo más el efecto del individuo sobre los parientes (ponderado por r). Concepto de Hamilton que explica el altruismo: ayudar a parientes cercanos propaga los propios genes indirectamente."},
{cat:"Comportamiento", q:"¿Qué es el altruismo recíproco?", a:"Comportamiento altruista hacia individuos no emparentados, que se benefician cuando el receptor devuelve el favor. Funciona cuando la probabilidad de volver a encontrarse es alta y hay memoria. Trivers (1971)."},
{cat:"Comportamiento", q:"¿Qué es el comportamiento social y la eusocialidad?", a:"Eusocialidad: el nivel más alto de organización social. Tres características: cuidado cooperativo de crías, generaciones superpuestas, división reproductiva (casta). Ej: hormigas, abejas, termitas, topo-topo desnudo."},

/* ─── UNIDAD 24: ECOLOGÍA HUMANA Y SOSTENIBILIDAD ─── */
{cat:"Ecología Humana", q:"¿Cuál ha sido la tendencia de la población humana?", a:"La población humana creció de forma exponencial desde la Revolución Industrial: 1 mil millones (1800) → 2 mm (1927) → 7 mm (2011) → >8 mm (2022). La tasa de crecimiento ha disminuido (~1% anual) pero el incremento absoluto sigue siendo enorme."},
{cat:"Ecología Humana", q:"¿Qué es la huella ecológica?", a:"Área de territorio biológicamente productivo necesario para producir los recursos que consume una persona/ciudad/país y absorber sus desechos. La huella global supera la biocapacidad del planeta (déficit ecológico)."},
{cat:"Ecología Humana", q:"¿Qué es el desarrollo sostenible?", a:"Desarrollo que satisface las necesidades del presente sin comprometer la capacidad de las generaciones futuras para satisfacer las suyas (Brundtland, 1987). Integra metas económicas, sociales y ambientales."},
{cat:"Ecología Humana", q:"¿Qué es la tragedia de los comunes (Hardin, 1968)?", a:"Cuando un recurso compartido (pesca, pastizal, aire) es de acceso libre, cada individuo tiene incentivo a sobreexplotarlo, aunque el resultado colectivo sea la destrucción del recurso. Soluciones: privatización, regulación, gestión comunitaria (Ostrom)."},
{cat:"Ecología Humana", q:"¿Qué son las soluciones de Ostrom para los comunes?", a:"Elinor Ostrom (Nobel 2009) identificó condiciones para gestión sostenible de comunes: límites claros, reglas adaptadas localmente, monitoreo, sanciones graduadas, mecanismos de resolución de conflictos y reconocimiento de derechos."},
{cat:"Ecología Humana", q:"¿Qué es la economía ecológica?", a:"Campo que estudia la relación entre economías y ecosistemas. Propone valorar económicamente los servicios ecosistémicos para incluirlos en decisiones políticas y económicas. Crítica al PIB como medida del bienestar."},


/* ─── CUESTIONARIO ADICIONAL: preguntas del archivo adjunto ─── */
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿En qué difieren ecología y ecologismo?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿De qué forma depende el ecologismo de la ciencia de la ecología?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿De qué manera podría la inclusión del medio ambiente físico en el marco del ecosistema ayudar a los ecólogos a alcanzar el objetivo básico de comprender la interacción de los organismos con su medio ambiente?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué es una hipótesis?", a:"La ecología utiliza el método científico: observación, formulación de hipótesis, predicción, experimentación y conclusión. Las hipótesis deben ser falsificables (Popper). Los estudios ecológicos incluyen experimentos de campo, experimentos de laboratorio, modelos matemáticos y observaciones a largo plazo. La replicación, el control y la aleatorización son esenciales para inferencias válidas. Los estudios observacionales son comunes cuando no es posible manipular el sistema, pero dificultan la inferencia causal."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué papel desempeñan las hipótesis en la ciencia?", a:"La ecología utiliza el método científico: observación, formulación de hipótesis, predicción, experimentación y conclusión. Las hipótesis deben ser falsificables (Popper). Los estudios ecológicos incluyen experimentos de campo, experimentos de laboratorio, modelos matemáticos y observaciones a largo plazo. La replicación, el control y la aleatorización son esenciales para inferencias válidas. Los estudios observacionales son comunes cuando no es posible manipular el sistema, pero dificultan la inferencia causal."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿Qué es un modelo?", a:"Una metapoblación (Levins, 1970) es un conjunto de poblaciones locales parcialmente aisladas pero conectadas por dispersión. Las poblaciones locales se extinguen y se recolonizan periódicamente. El modelo de Levins: dp/dt = mp(1-p) − ep, donde p es la fracción de parches ocupados, m es la tasa de colonización y e es la tasa de extinción local. El equilibrio p* = 1 - e/m; la metapoblación persiste globalmente si m > e. Fundamental para entender los efectos de la fragmentación del hábitat."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Cuál es la relación entre hipótesis y modelos?", a:"La ecología utiliza el método científico: observación, formulación de hipótesis, predicción, experimentación y conclusión. Las hipótesis deben ser falsificables (Popper). Los estudios ecológicos incluyen experimentos de campo, experimentos de laboratorio, modelos matemáticos y observaciones a largo plazo. La replicación, el control y la aleatorización son esenciales para inferencias válidas. Los estudios observacionales son comunes cuando no es posible manipular el sistema, pero dificultan la inferencia causal."},
{cat:"Cuestionario Smith & Smith – Cap. 5", q:"¿Qué es la selección natural?", a:"Una adaptación es un rasgo heredable que aumenta la aptitud darwiniana (fitness) de un individuo en su ambiente particular. Las adaptaciones son el resultado de la selección natural actuando sobre la variación genética durante generaciones. Pueden ser morfológicas (forma del cuerpo, coloración), fisiológicas (osmorregulación, termorregulación) o conductuales (migración, comunicación). No todas las características de un organismo son adaptaciones: algunas son restricciones evolutivas o efectos secundarios de otras adaptaciones."},
