{cat:"Cuestionario Smith & Smith – Cap. 17", q:"¿Cómo interactúan la temperatura y la precipitación para afectar a la producción primaria neta en los ecosistemas terrestres?", a:"En ecosistemas terrestres, la NPP está limitada principalmente por la temperatura y la precipitación. La relación más fuerte es con la evapotranspiración real (AET), que integra ambos factores: la NPP aumenta linealmente con la AET. Las regiones tropicales con alta temperatura y precipitación tienen la mayor NPP. Los nutrientes (nitrógeno y fósforo) también limitan la NPP en muchos ecosistemas; los experimentos de fertilización muestran aumentos sustanciales de producción al añadir N o P."},
{cat:"Cuestionario Smith & Smith – Cap. 17", q:"¿De qué manera varía la producción primaria neta frente a la profundidad del agua en los ecosistemas de aguas estan cadas (lagos y océanos)?", a:"En ecosistemas acuáticos, la NPP está limitada principalmente por la luz y los nutrientes. La zona fótica (profundidad a la cual la luz es suficiente para la fotosíntesis neta positiva) varía de pocos centímetros en aguas turbias a 200 m en aguas oceánicas claras. La compensación entre productividad (zona eufótica) y respiración (toda la columna de agua) determina la producción neta. En el océano abierto, el nitrógeno y el fósforo son los nutrientes más limitantes; en algunas regiones oceánicas, el hierro (Fe) es el factor limitante principal (hipótesis del hierro)."},
{cat:"Cuestionario Smith & Smith – Cap. 17", q:"¿En qué se basa el perfil vertical de producción primaria neta en dichos ecosistemas?", a:"La producción primaria bruta (GPP, Gross Primary Production) es la cantidad total de energía fijada por los productores primarios mediante la fotosíntesis por unidad de área y tiempo. La producción primaria neta (NPP, Net Primary Production) es la energía disponible para los consumidores: NPP = GPP − Ra, donde Ra es la respiración autotrófica (de los propios productores). La NPP varía desde ~25 g C m⁻² año⁻¹ en desiertos y tundra hasta ~2200 g C m⁻² año⁻¹ en selvas tropicales. Se mide en g C m⁻² año⁻¹ o en kcal m⁻² año⁻¹."},
{cat:"Cuestionario Smith & Smith – Cap. 26", q:"¿Cómo funciona la producción primaria como restricción de la producción secundaria en los ecosistemas?", a:"Los servicios ecosistémicos (Millennium Ecosystem Assessment, 2005) son los beneficios que las personas obtienen de los ecosistemas, clasificados en cuatro categorías: 1) Servicios de aprovisionamiento: alimentos, agua dulce, madera, fibra, medicamentos. 2) Servicios de regulación: regulación del clima, purificación del agua, control de inundaciones, polinización, control de plagas. 3) Servicios culturales: valores espirituales, recreación, turismo, identidad cultural. 4) Servicios de soporte: formación del suelo, ciclo de nutrientes, producción primaria (base de todos los demás)."},
{cat:"Cuestionario Smith & Smith – Cap. 17", q:"¿Qué implica el modelo de control por los depredadores de la estructura de la cadena trófica con respecto al papel de los productores secundarios en el control de la producción primaria neta y la biomasa en pie de los ecosistemas?", a:"La producción primaria bruta (GPP, Gross Primary Production) es la cantidad total de energía fijada por los productores primarios mediante la fotosíntesis por unidad de área y tiempo. La producción primaria neta (NPP, Net Primary Production) es la energía disponible para los consumidores: NPP = GPP − Ra, donde Ra es la respiración autotrófica (de los propios productores). La NPP varía desde ~25 g C m⁻² año⁻¹ en desiertos y tundra hasta ~2200 g C m⁻² año⁻¹ en selvas tropicales. Se mide en g C m⁻² año⁻¹ o en kcal m⁻² año⁻¹."},
{cat:"Cuestionario Smith & Smith – Cap. 18", q:"¿Cómo se relacionan la eficiencia de asimilación y la de producción con el flujo de energía por un nivel trófico?", a:"La eficiencia ecológica (trophic efficiency) es la proporción de energía transferida de un nivel trófico al siguiente. La \"regla del 10%\" es una aproximación: solo ~10% de la energía de un nivel trófico pasa al siguiente. El resto se pierde como calor en la respiración, en partes no consumidas, en excreción y heces. Esta pérdida limita la longitud de las cadenas tróficas a 4-5 niveles en la mayoría de los ecosistemas. Las pirámides de energía siempre tienen forma piramidal (ley de la termodinámica)."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Cuál es la diferencia en la distribución de energía y la eficiencia de producción entre los homeotermos y poiquilotermos?", a:"La energía solar es el motor del clima de la Tierra. La cantidad de radiación solar que recibe una superficie depende del ángulo de incidencia (que varía con la latitud y la estación). En el ecuador, el sol incide casi perpendicularmente, concentrando más energía por unidad de área. En los polos, la misma cantidad de energía se distribuye sobre un área mayor, generando temperaturas más bajas. Esta diferencia de calentamiento genera los grandes patrones de circulación atmosférica y oceánica."},
{cat:"Cuestionario Smith & Smith – Cap. 15", q:"¿Cuáles son las dos cadenas tróficas principales y de qué manera se relacionan?", a:"Una red trófica (food web) es la representación de todas las relaciones alimentarias en una comunidad: quién come a quién. Los elementos son: productores (plantas, algas, cianobacterias), consumidores primarios (herbívoros), consumidores secundarios (carnívoros que comen herbívoros), consumidores terciarios (carnívoros que comen carnívoros) y descomponedores (bacterias y hongos que descomponen la materia orgánica). Las redes tróficas reales son mucho más complejas que las cadenas alimentarias lineales, con múltiples conexiones."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Cómo difiere la eficiencia de consumo entre los ecosistemas terrestres y marinos?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 28", q:"¿Cuáles son los principales des componedores microbianos del material vegetal y animal?", a:"La desertificación es la degradación de tierras en zonas áridas, semiáridas y subhúmedas resultante de la variabilidad climática y las actividades humanas. Causas principales: sobrepastoreo (destruye la cubierta vegetal y compacta el suelo), deforestación, agricultura de secano en suelos marginales, riego inadecuado (salinización). Consecuencias: pérdida de cubierta vegetal, erosión del suelo (eólica e hídrica), reducción de la productividad, pérdida de biodiversidad y degradación socioeconómica. Afecta a ~2000 millones de personas en más de 100 países."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿De qué modo el tipo de componentes del carbono presentes en la materia orgánica muerta influyen en su calidad como fuente de energía para los descomponedo res?", a:"El perfil del suelo está organizado en horizontes: O (capa orgánica superficial: hojarasca y materia orgánica descompuesta), A (topsoil: mezcla de mineral y humus, zona de máxima actividad biológica), E (zona de eluviación: pérdida de minerales por lixiviación), B (zona de iluviación: acumulación de minerales lavados del horizonte A), C (material parental parcialmente alterado) y R (roca madre no alterada). La profundidad y características de cada horizonte varían con el tipo de suelo y el clima."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿De qué modo la concentración de lignina influ ye en la descomposición de la hojarasca?", a:"El perfil del suelo está organizado en horizontes: O (capa orgánica superficial: hojarasca y materia orgánica descompuesta), A (topsoil: mezcla de mineral y humus, zona de máxima actividad biológica), E (zona de eluviación: pérdida de minerales por lixiviación), B (zona de iluviación: acumulación de minerales lavados del horizonte A), C (material parental parcialmente alterado) y R (roca madre no alterada). La profundidad y características de cada horizonte varían con el tipo de suelo y el clima."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿Qué supone un incremento en el contenido de nitrógeno de los tejidos vegetales en des composición para las tasas relativas de mineralización e inmovilización?", a:"Cuando los recursos son ilimitados, una población crece a su tasa intrínseca máxima de incremento (r). El crecimiento exponencial se describe por: dN/dt = rN, cuya solución es Nt = N₀eʳᵗ. La tasa r = tasa de natalidad per cápita (b) − tasa de mortalidad per cápita (d). La curva de crecimiento exponencial tiene forma de J. Es insostenible a largo plazo porque los recursos son finitos. Ocurre en situaciones de colonización, recuperación post-catástrofe o introducción de especies exóticas."},
{cat:"Cuestionario Smith & Smith – Cap. 13", q:"¿De qué modo podría influir este factor en el proceso de circulación del nitrógeno en estos bosques?", a:"Las micorrizas son asociaciones mutualistas entre hongos y raíces de plantas vasculares. El hongo proporciona a la planta agua y nutrientes minerales (especialmente fósforo y nitrógeno) al extender la red de hifas muy por encima de la zona de absorción de las raíces. La planta proporciona al hongo carbohidratos (hasta el 20% de su producción fotosintética). Tipos: ectomicorrizas (hifas rodean pero no penetran las células de la raíz; bosques de coníferas y robles) y endomicorrizas arbusculares (hifas penetran en las células; >80% de las plantas terrestres)."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿En qué consiste la extraordinaria diferencia?", a:"La energía solar es el motor del clima de la Tierra. La cantidad de radiación solar que recibe una superficie depende del ángulo de incidencia (que varía con la latitud y la estación). En el ecuador, el sol incide casi perpendicularmente, concentrando más energía por unidad de área. En los polos, la misma cantidad de energía se distribuye sobre un área mayor, generando temperaturas más bajas. Esta diferencia de calentamiento genera los grandes patrones de circulación atmosférica y oceánica."},
{cat:"Cuestionario Smith & Smith – Cap. 22", q:"¿De qué modo los cambios en la termoclina influyen en los patrones estacionales de productividad neta primaria en los ecosistemas de lagos?", a:"Los lagos y estanques son ecosistemas lénticos (agua quieta). Zonas: litoral (zona costera somera con macrófitas acuáticas, alta productividad), limnética (zona pelágica abierta, fitoplancton y zooplancton), profunda o profundal (poca o nula luz, descomposición, anoxia frecuente) y béntica (sedimentos del fondo). La estratificación térmica estacional (termoclina) divide el lago en capas con diferente temperatura y densidad. El turnover otoñal e invernal mezcla el agua y redistribuye nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 22", q:"¿De qué modo el flujo continuo y direccional del agua influye en la circulación de nutrientes en los ecosistemas de arroyos?", a:"Los ríos y arroyos son ecosistemas lóticos (agua que fluye). El Concepto del Río Continuo (Vannote et al., 1980) describe un gradiente continuo de condiciones desde la cabecera (estrecha, sombreada, fría, aguas claras, alta oxigenación, materia orgánica alóctona-hojas) hasta la desembocadura (ancha, soleada, cálida, turbia, baja oxigenación, materia orgánica fina). Los organismos fluviales están adaptados a la corriente (bentos agarrado, forma aerodinámica) y al régimen de perturbaciones (crecidas periódicas)."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué mecanismo actúa en la conservación de nutrientes en los ecosistemas de los estuarios?", a:"La ecología incluye varias subdisciplinas: ecología fisiológica (respuestas de individuos a condiciones ambientales), ecología de poblaciones (dinámica de grupos de una especie), ecología de comunidades (interacciones entre especies), ecología de ecosistemas (flujo de energía y ciclo de nutrientes), ecología del paisaje (patrones espaciales), y macroecología (patrones globales de biodiversidad). La ecología aplicada incluye biología de la conservación, manejo de vida silvestre, restauración ecológica y ecología urbana."},
{cat:"Cuestionario Smith & Smith – Cap. 19", q:"¿Cómo están involucrados los procesos de fotosíntesis y descomposición en el ciclo del carbono?", a:"El ciclo del carbono describe el movimiento del carbono entre la atmósfera, los organismos vivos, el suelo y el océano. Los procesos principales son: fotosíntesis (captura CO₂ atmosférico), respiración (libera CO₂), descomposición (libera CO₂ y CH₄), combustión de combustibles fósiles (libera CO₂ acumulado durante millones de años), y formación de carbonatos en el océano. El océano y los ecosistemas terrestres actúan como sumideros de carbono, absorbiendo parte del CO₂ antropogénico, pero no lo suficiente para compensar las emisiones."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿es mayor durante el día o durante la noche?", a:"El fotoperiodismo es la respuesta de los organismos a la duración relativa del día y la noche (fotoperiodo). En plantas, controla la floración: plantas de día largo (florecen cuando el día supera un umbral crítico: cereales, espinacas), plantas de día corto (florecen cuando el día es corto: crisantemos, café), y plantas neutras (no responden al fotoperiodo: tomate). En animales, el fotoperiodo regula la reproducción estacional, la migración, la muda y la hibernación."},
{cat:"Cuestionario Smith & Smith – Cap. 19", q:"¿Qué mecanismos biológicos y no biológicos son los responsables de la fijación del nitrógeno?", a:"El nitrógeno es el elemento más abundante en la atmósfera (78% como N₂) pero las plantas no pueden usarlo directamente. Los procesos del ciclo del nitrógeno son: Fijación biológica: bacterias (Rhizobium en leguminosas, Azotobacter libre, cianobacterias) convierten N₂ en NH₄⁺. Nitrificación: bacterias (Nitrosomonas, Nitrobacter) oxidan NH₄⁺ a NO₂⁻ y NO₃⁻. Asimilación: plantas absorben NH₄⁺ y NO₃⁻. Amonificación: descomposición de materia orgánica libera NH₄⁺. Desnitrificación: bacterias anaerobias convierten NO₃⁻ en N₂ y N₂O."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Cuál es la fuente de azufre en el ciclo del azufre?", a:"La ecología incluye varias subdisciplinas: ecología fisiológica (respuestas de individuos a condiciones ambientales), ecología de poblaciones (dinámica de grupos de una especie), ecología de comunidades (interacciones entre especies), ecología de ecosistemas (flujo de energía y ciclo de nutrientes), ecología del paisaje (patrones espaciales), y macroecología (patrones globales de biodiversidad). La ecología aplicada incluye biología de la conservación, manejo de vida silvestre, restauración ecológica y ecología urbana."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿Por qué el ciclo del azufre posee características de ciclos gaseosos y de ciclos sedimentarios?", a:"Muchas poblaciones muestran oscilaciones cíclicas en su abundancia. Los ciclos de 3-4 años son típicos de micromamíferos (lemmings, ratones de campo) en tundra y bosque boreal. Los ciclos de ~10 años son característicos de la liebre de raquetas (Lepus americanus) y el lince canadiense (Lynx canadensis) en la taiga norteamericana. Las causas de los ciclos son debatidas: interacciones depredador-presa, calidad del alimento, respuesta inmune. Los datos de la Compañía de la Bahía de Hudson (1736-1930) documentan el ciclo liebre-lince."},
{cat:"Cuestionario Smith & Smith – Cap. 19", q:"¿Cuál es la fuente del fósforo en el ciclo del fósforo?", a:"El fósforo no tiene una fase gaseosa significativa en la atmósfera, siendo un ciclo principalmente sedimentario. El P es liberado por meteorización de rocas fosfáticas, es absorbido por las plantas como H₂PO₄⁻ o HPO₄²⁻, pasa a través de la cadena trófica, y es devuelto al suelo por la descomposición. Parte del P se pierde por lixiviación hacia los ríos y océanos, donde se sedimenta. El P es el nutriente limitante más común en ecosistemas de agua dulce (Ley de Liebig). La minería de roca fosfórica y los fertilizantes han perturbado enormemente el ciclo del P."},
{cat:"Cuestionario Smith & Smith – Cap. 20", q:"¿Cuáles son las principales diferencias entre la selva llu viosa tropical y el bosque seco tropical?", a:"Un bioma es una región geográfica extensa con un tipo de vegetación característico, determinado principalmente por el clima (temperatura y precipitación). Los biomas son la unidad de análisis ecológico a escala global. La mayoría de los biomas terrestres se definen por el tipo dominante de vegetación: selva tropical, bosque templado caducifolio, taiga, tundra, desierto, pastizal, etc. Los biomas similares pueden aparecer en diferentes continentes con climas análogos, aunque con especies diferentes (convergencia ecológica)."},
{cat:"Cuestionario Smith & Smith – Cap. 20", q:"¿Cuáles son los estratos principales en la selva lluviosa tropical?", a:"La selva tropical lluviosa (tropical rainforest) se localiza en latitudes ecuatoriales (América Central y Sur, África central, Sudeste Asiático). Clima: temperatura >25°C todo el año, precipitación >2000 mm/año bien distribuida. Alberga más del 50% de las especies terrestres en solo el 7% de la superficie. Alta estratificación vertical: dosel (25-40 m), subdosel, sotobosque y suelo. Suelos pobres (oxisoles): los nutrientes están en la biomasa, no en el suelo. Alta NPP (~2000-2200 g C m⁻² año⁻¹). Principal amenaza: deforestación."},
{cat:"Cuestionario Smith & Smith – Cap. 17", q:"¿De qué modo el ambiente cálido y húmedo de la selva tropical influencia las tasas de producción primaria neta y de descomposición?", a:"La producción primaria bruta (GPP, Gross Primary Production) es la cantidad total de energía fijada por los productores primarios mediante la fotosíntesis por unidad de área y tiempo. La producción primaria neta (NPP, Net Primary Production) es la energía disponible para los consumidores: NPP = GPP − Ra, donde Ra es la respiración autotrófica (de los propios productores). La NPP varía desde ~25 g C m⁻² año⁻¹ en desiertos y tundra hasta ~2200 g C m⁻² año⁻¹ en selvas tropicales. Se mide en g C m⁻² año⁻¹ o en kcal m⁻² año⁻¹."},
{cat:"Cuestionario Smith & Smith – Cap. 20", q:"¿Qué tipos de árboles caracterizan la selva lluviosa tropical (tipo de hoja)?", a:"Un bioma es una región geográfica extensa con un tipo de vegetación característico, determinado principalmente por el clima (temperatura y precipitación). Los biomas son la unidad de análisis ecológico a escala global. La mayoría de los biomas terrestres se definen por el tipo dominante de vegetación: selva tropical, bosque templado caducifolio, taiga, tundra, desierto, pastizal, etc. Los biomas similares pueden aparecer en diferentes continentes con climas análogos, aunque con especies diferentes (convergencia ecológica)."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué distingue a las sabanas de los ecosistemas de pradera?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿En qué condiciones climáticas se encuentran ecosistemas de sabana tropical?", a:"La ecología incluye varias subdisciplinas: ecología fisiológica (respuestas de individuos a condiciones ambientales), ecología de poblaciones (dinámica de grupos de una especie), ecología de comunidades (interacciones entre especies), ecología de ecosistemas (flujo de energía y ciclo de nutrientes), ecología del paisaje (patrones espaciales), y macroecología (patrones globales de biodiversidad). La ecología aplicada incluye biología de la conservación, manejo de vida silvestre, restauración ecológica y ecología urbana."},
{cat:"Cuestionario Smith & Smith – Cap. 17", q:"¿De qué modo la estacionalidad influencia las tasas de producción primaria neta y de descomposición en los ecosistemas de sabana?", a:"La producción primaria bruta (GPP, Gross Primary Production) es la cantidad total de energía fijada por los productores primarios mediante la fotosíntesis por unidad de área y tiempo. La producción primaria neta (NPP, Net Primary Production) es la energía disponible para los consumidores: NPP = GPP − Ra, donde Ra es la respiración autotrófica (de los propios productores). La NPP varía desde ~25 g C m⁻² año⁻¹ en desiertos y tundra hasta ~2200 g C m⁻² año⁻¹ en selvas tropicales. Se mide en g C m⁻² año⁻¹ o en kcal m⁻² año⁻¹."},
{cat:"Cuestionario Smith & Smith – Cap. 26", q:"¿Qué características de clima regional conducen a la formación de ecosistemas de desierto?", a:"Los servicios ecosistémicos (Millennium Ecosystem Assessment, 2005) son los beneficios que las personas obtienen de los ecosistemas, clasificados en cuatro categorías: 1) Servicios de aprovisionamiento: alimentos, agua dulce, madera, fibra, medicamentos. 2) Servicios de regulación: regulación del clima, purificación del agua, control de inundaciones, polinización, control de plagas. 3) Servicios culturales: valores espirituales, recreación, turismo, identidad cultural. 4) Servicios de soporte: formación del suelo, ciclo de nutrientes, producción primaria (base de todos los demás)."},
{cat:"Cuestionario Smith & Smith – Cap. 24", q:"¿Qué clima caracteriza a los ecosistemas mediterráneos?", a:"La biodiversidad comprende tres niveles: diversidad genética (variación dentro de una especie), diversidad de especies (número y distribución de especies) y diversidad de ecosistemas (variedad de hábitats y ecosistemas). El valor de la biodiversidad incluye: valor de uso directo (alimentos, medicamentos, materiales), valor de uso indirecto (servicios ecosistémicos: purificación del agua, regulación del clima, polinización), valor de opción (posibles usos futuros), y valor de existencia (valor intrínseco independiente del uso humano)."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿Qué tipo de hojas son características de las plantas mediterráneas?", a:"El perfil del suelo está organizado en horizontes: O (capa orgánica superficial: hojarasca y materia orgánica descompuesta), A (topsoil: mezcla de mineral y humus, zona de máxima actividad biológica), E (zona de eluviación: pérdida de minerales por lixiviación), B (zona de iluviación: acumulación de minerales lavados del horizonte A), C (material parental parcialmente alterado) y R (roca madre no alterada). La profundidad y características de cada horizonte varían con el tipo de suelo y el clima."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿Qué tipo de hojas son características de los árboles de ecosistemas forestales templados?", a:"El perfil del suelo está organizado en horizontes: O (capa orgánica superficial: hojarasca y materia orgánica descompuesta), A (topsoil: mezcla de mineral y humus, zona de máxima actividad biológica), E (zona de eluviación: pérdida de minerales por lixiviación), B (zona de iluviación: acumulación de minerales lavados del horizonte A), C (material parental parcialmente alterado) y R (roca madre no alterada). La profundidad y características de cada horizonte varían con el tipo de suelo y el clima."},
{cat:"Cuestionario Smith & Smith – Cap. 17", q:"¿De qué modo la estacionalidad de la temperatura influye en la estructura y la producción de los ecosistemas forestales templados?", a:"En ecosistemas terrestres, la NPP está limitada principalmente por la temperatura y la precipitación. La relación más fuerte es con la evapotranspiración real (AET), que integra ambos factores: la NPP aumenta linealmente con la AET. Las regiones tropicales con alta temperatura y precipitación tienen la mayor NPP. Los nutrientes (nitrógeno y fósforo) también limitan la NPP en muchos ecosistemas; los experimentos de fertilización muestran aumentos sustanciales de producción al añadir N o P."},
{cat:"Cuestionario Smith & Smith – Cap. 20", q:"¿Cuál es el clima característico de las praderas templadas?", a:"Un bioma es una región geográfica extensa con un tipo de vegetación característico, determinado principalmente por el clima (temperatura y precipitación). Los biomas son la unidad de análisis ecológico a escala global. La mayoría de los biomas terrestres se definen por el tipo dominante de vegetación: selva tropical, bosque templado caducifolio, taiga, tundra, desierto, pastizal, etc. Los biomas similares pueden aparecer en diferentes continentes con climas análogos, aunque con especies diferentes (convergencia ecológica)."},
{cat:"Cuestionario Smith & Smith – Cap. 20", q:"¿De qué modo la precipitación anual influye en la estructura y la productividad de los ecosistemas de pradera?", a:"Los pastizales o praderas templadas (temperate grasslands) se localizan en los interiores de continentes: Great Plains (Norteamérica), Pampas (Sudamérica), estepa euroasiática, veld (Sudáfrica). Precipitación 250-750 mm/año: suficiente para evitar la desertificación pero insuficiente para sostener bosques. Las gramíneas dominan; los árboles son escasos. Los fuegos periódicos e incendios y los grandes herbívoros (bisontes, caballos salvajes, antílopes) mantienen la estructura. Suelos muy ricos en materia orgánica (mollisoles): los más productivos del mundo para la agricultura."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿Qué tipos de árboles caracterizan el bosque boreal?", a:"Muchas poblaciones muestran oscilaciones cíclicas en su abundancia. Los ciclos de 3-4 años son típicos de micromamíferos (lemmings, ratones de campo) en tundra y bosque boreal. Los ciclos de ~10 años son característicos de la liebre de raquetas (Lepus americanus) y el lince canadiense (Lynx canadensis) en la taiga norteamericana. Las causas de los ciclos son debatidas: interacciones depredador-presa, calidad del alimento, respuesta inmune. Los datos de la Compañía de la Bahía de Hudson (1736-1930) documentan el ciclo liebre-lince."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué es el permafrost, y cómo influye en la estructura y la producción de los ecosistemas forestales boreales?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 20", q:"¿Cuáles son las características físicas y biológicas de la tundra ártica?", a:"La tundra se localiza al norte de la taiga (ártica) y en las cimas de las montañas (alpina). Clima: temperatura media anual <0°C, temporada de crecimiento de solo 60-90 días, precipitación baja (~250 mm/año). El permafrost (suelo permanentemente congelado) impide el drenaje y el enraizamiento profundo. Vegetación baja: musgos, líquenes, graminoides, arbustos enanos. Baja diversidad vegetal pero alta densidad de aves migratorias y mamíferos (caribúes, lemming, bueyes almizcleros). La tundra es especialmente vulnerable al cambio climático: el permafrost libera CO₂ y CH₄ al descongelarse."},
{cat:"Cuestionario Smith & Smith – Cap. 20", q:"¿En qué se diferencian la tundra alpina de la tundra ártica?", a:"La tundra se localiza al norte de la taiga (ártica) y en las cimas de las montañas (alpina). Clima: temperatura media anual <0°C, temporada de crecimiento de solo 60-90 días, precipitación baja (~250 mm/año). El permafrost (suelo permanentemente congelado) impide el drenaje y el enraizamiento profundo. Vegetación baja: musgos, líquenes, graminoides, arbustos enanos. Baja diversidad vegetal pero alta densidad de aves migratorias y mamíferos (caribúes, lemming, bueyes almizcleros). La tundra es especialmente vulnerable al cambio climático: el permafrost libera CO₂ y CH₄ al descongelarse."},

{cat:"Cuestionario Smith & Smith – Cap. 22", q:"¿Qué distingue a la zona limnética de la zona profunda?", a:"Los lagos y estanques son ecosistemas lénticos (agua quieta). Zonas: litoral (zona costera somera con macrófitas acuáticas, alta productividad), limnética (zona pelágica abierta, fitoplancton y zooplancton), profunda o profundal (poca o nula luz, descomposición, anoxia frecuente) y béntica (sedimentos del fondo). La estratificación térmica estacional (termoclina) divide el lago en capas con diferente temperatura y densidad. El turnover otoñal e invernal mezcla el agua y redistribuye nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 22", q:"¿Qué condiciones distinguen la zona bentónica de otras capas de ecosistemas lacustres?", a:"Los lagos y estanques son ecosistemas lénticos (agua quieta). Zonas: litoral (zona costera somera con macrófitas acuáticas, alta productividad), limnética (zona pelágica abierta, fitoplancton y zooplancton), profunda o profundal (poca o nula luz, descomposición, anoxia frecuente) y béntica (sedimentos del fondo). La estratificación térmica estacional (termoclina) divide el lago en capas con diferente temperatura y densidad. El turnover otoñal e invernal mezcla el agua y redistribuye nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Cuál es el papel dominante de la zona bentónica?", a:"El calentamiento diferencial entre el ecuador y los polos genera células de convección atmosférica: la célula de Hadley (0-30°), la célula de Ferrel (30-60°) y la célula Polar (60-90°). En el ecuador, el aire caliente asciende, se enfría y precipita (zona de lluvias tropicales). En torno a los 30°, el aire seco desciende, generando zonas áridas (grandes desiertos subtropicales: Sahara, Atacama, Sonora). Alrededor de los 60° vuelven las lluvias. En los polos, el aire frío y seco desciende."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Qué características físicas son únicas de los ecosistemas de aguas corrientes?", a:"El agua es esencial para la vida por sus propiedades únicas: alta capacidad calorífica (amortigua cambios de temperatura), calor de vaporización elevado (el sudor enfría eficientemente), cohesión y tensión superficial, expansión al congelarse (el hielo flota, protegiendo los ecosistemas acuáticos), y es el solvente universal. Los organismos deben mantener su balance hídrico: ingesta de agua = pérdida de agua (por evaporación, orina, heces). Las adaptaciones al estrés hídrico son cruciales en ambientes áridos."},
{cat:"Cuestionario Smith & Smith – Cap. 22", q:"¿Cómo cambian las condiciones ambientales a lo largo del continuo de un río?", a:"Los ríos y arroyos son ecosistemas lóticos (agua que fluye). El Concepto del Río Continuo (Vannote et al., 1980) describe un gradiente continuo de condiciones desde la cabecera (estrecha, sombreada, fría, aguas claras, alta oxigenación, materia orgánica alóctona-hojas) hasta la desembocadura (ancha, soleada, cálida, turbia, baja oxigenación, materia orgánica fina). Los organismos fluviales están adaptados a la corriente (bentos agarrado, forma aerodinámica) y al régimen de perturbaciones (crecidas periódicas)."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué es un estuario?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 17", q:"¿En que forma difiere la estratificación de la temperatura en mares tropicales de las regiones templadas del océano?", a:"En ecosistemas terrestres, la NPP está limitada principalmente por la temperatura y la precipitación. La relación más fuerte es con la evapotranspiración real (AET), que integra ambos factores: la NPP aumenta linealmente con la AET. Las regiones tropicales con alta temperatura y precipitación tienen la mayor NPP. Los nutrientes (nitrógeno y fósforo) también limitan la NPP en muchos ecosistemas; los experimentos de fertilización muestran aumentos sustanciales de producción al añadir N o P."},
{cat:"Cuestionario Smith & Smith – Cap. 22", q:"¿De qué forma influyen estas diferencias en los patrones de productividad primaria?", a:"Los lagos oligotróficos tienen bajas concentraciones de nutrientes (N, P), agua muy clara, alta concentración de oxígeno en toda la columna de agua, baja productividad primaria y alta diversidad de especies. Son típicos de regiones de roca cristalina como el escudo canadiense. Los lagos eutróficos tienen alta concentración de nutrientes, agua turbia (floración de algas), hipoxia o anoxia en el hipolimnion, alta productividad primaria y baja diversidad. La eutrofización antrópica convierte artificialmente lagos oligotróficos en eutróficos."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿A qué estrés ambiental están expuestos los organismos que habitan en las zonas intermareales rocosas?", a:"Los organismos ectotérmicos (poiquilotermos) dependen del calor externo para regular su temperatura corporal: peces, reptiles, anfibios, invertebrados. Su tasa metabólica varía con la temperatura ambiental (Q₁₀ ≈ 2: por cada 10°C de aumento, la tasa metabólica se duplica). Los endotérmicos (homeotérmicos) generan calor interno (mediante el metabolismo) y mantienen temperatura corporal constante: mamíferos y aves. Los endotérmicos gastan 10 veces más energía pero pueden estar activos en mayor rango térmico."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿En qué se diferencia la vida en las costas arenosas a la vida en las zonas intermareales rocosas?", a:"La ecología incluye varias subdisciplinas: ecología fisiológica (respuestas de individuos a condiciones ambientales), ecología de poblaciones (dinámica de grupos de una especie), ecología de comunidades (interacciones entre especies), ecología de ecosistemas (flujo de energía y ciclo de nutrientes), ecología del paisaje (patrones espaciales), y macroecología (patrones globales de biodiversidad). La ecología aplicada incluye biología de la conservación, manejo de vida silvestre, restauración ecológica y ecología urbana."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿En qué se ase mejan?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué influye sobre las características estructurales más importantes (zonación) de una marisma?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 19", q:"¿Qué es un humedal de agua dulce?", a:"El fósforo no tiene una fase gaseosa significativa en la atmósfera, siendo un ciclo principalmente sedimentario. El P es liberado por meteorización de rocas fosfáticas, es absorbido por las plantas como H₂PO₄⁻ o HPO₄²⁻, pasa a través de la cadena trófica, y es devuelto al suelo por la descomposición. Parte del P se pierde por lixiviación hacia los ríos y océanos, donde se sedimenta. El P es el nutriente limitante más común en ecosistemas de agua dulce (Ley de Liebig). La minería de roca fosfórica y los fertilizantes han perturbado enormemente el ciclo del P."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Cuáles son los tres tipos más importantes de humedales según su hidrología (flujo de agua)?", a:"Las plantas C3 fijan el CO₂ directamente mediante la enzima RuBisCO, produciendo un compuesto de 3 carbonos (3-fosfoglicerato). Son ineficientes a altas temperaturas y baja CO₂ por la fotorrespiración. Las plantas C4 (maíz, caña de azúcar, sorgo) concentran el CO₂ en células del mesófilo antes de enviarlo a las células del haz, eliminando casi la fotorrespiración: son más eficientes en climas cálidos y áridos. Las plantas CAM (cactus, agaves, piñas) abren los estomas de noche para fijar CO₂, minimizando la pérdida de agua."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Qué es un hidroperíodo y cómo se relaciona con la estructura de los humedales?", a:"Una población es un grupo de individuos de la misma especie que viven en la misma área al mismo tiempo y que pueden entrecruzarse. Los atributos de la población incluyen: tamaño (N), densidad (N por unidad de área), distribución espacial (cómo se distribuyen los individuos en el espacio), estructura de edades, tasa de natalidad (b), tasa de mortalidad (d), tasa de inmigración (i) y tasa de emigración (e). La tasa de crecimiento de la población es: ΔN/Δt = (b-d) + (i-e)."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿De qué manera ha cambiado la diversidad biológica de la Tierra en los últimos 600 años?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿Qué es una extinción en masa?", a:"El efecto Allee describe la reducción de la aptitud individual a bajas densidades de población. Causas: dificultad para encontrar pareja (costo de Allee más común), reducción de la defensa grupal contra depredadores, menor termorregulación grupal, menor éxito de polinización, falta de aprendizaje social. La consecuencia es un umbral mínimo de densidad (densidad crítica de Allee) por debajo del cual la población declina irremediablemente hacia la extinción. Es crucial en conservación de especies en peligro."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿Cómo varía la riqueza de especies frente a la latitud?", a:"La diversidad alfa (α) es la diversidad dentro de un hábitat o comunidad local: incluye riqueza de especies (número de especies) y equitatividad (cómo se distribuye la abundancia entre las especies). La diversidad beta (β) es la tasa de cambio en la composición de especies entre hábitats o a lo largo de un gradiente: β = γ/α. La diversidad gamma (γ) es la diversidad total de una región o paisaje. Whittaker introdujo estos términos en 1960 para analizar la diversidad a múltiples escalas espaciales."},
{cat:"Cuestionario Smith & Smith – Cap. 5", q:"¿Y frente a la altitud?", a:"La aclimatación (o aclimatización) es el ajuste fisiológico reversible que realiza un individuo en respuesta a cambios ambientales dentro de su vida. No implica cambios genéticos: si se devuelve al ambiente original, el organismo recupera su estado previo. Ejemplos: mayor producción de glóbulos rojos al vivir en altitud, cambios en la composición de membranas lipídicas con la temperatura. La adaptación genética ocurre a nivel poblacional mediante selección natural a lo largo de generaciones."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿De qué manera varía la riqueza de especies vegetales con el clima?", a:"Los índices de diversidad cuantifican la diversidad de una comunidad: Riqueza de especies (S): número total de especies; simple pero ignora la abundancia. Índice de Shannon-Wiener (H'): H' = −Σpᵢln(pᵢ); combina riqueza y equitatividad; mayor H' con más especies y distribución uniforme. Índice de Simpson (D): D = Σpᵢ² (probabilidad de que dos individuos pertenezcan a la misma especie); 1−D mide la diversidad. Equitatividad de Pielou (J'): J' = H'/H'max; varía de 0 (dominancia total) a 1 (perfecta equitatividad)."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Cómo se relaciona el clima con los patrones regionales de diversidad de vertebrados?", a:"La energía solar es el motor del clima de la Tierra. La cantidad de radiación solar que recibe una superficie depende del ángulo de incidencia (que varía con la latitud y la estación). En el ecuador, el sol incide casi perpendicularmente, concentrando más energía por unidad de área. En los polos, la misma cantidad de energía se distribuye sobre un área mayor, generando temperaturas más bajas. Esta diferencia de calentamiento genera los grandes patrones de circulación atmosférica y oceánica."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿Cómo afecta la heterogeneidad ambiental a los patrones de diversidad de especies?", a:"La diversidad alfa (α) es la diversidad dentro de un hábitat o comunidad local: incluye riqueza de especies (número de especies) y equitatividad (cómo se distribuye la abundancia entre las especies). La diversidad beta (β) es la tasa de cambio en la composición de especies entre hábitats o a lo largo de un gradiente: β = γ/α. La diversidad gamma (γ) es la diversidad total de una región o paisaje. Whittaker introdujo estos términos en 1960 para analizar la diversidad a múltiples escalas espaciales."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿De qué manera se relaciona la producción primaria con la riqueza de especies en los océanos?", a:"La diversidad alfa (α) es la diversidad dentro de un hábitat o comunidad local: incluye riqueza de especies (número de especies) y equitatividad (cómo se distribuye la abundancia entre las especies). La diversidad beta (β) es la tasa de cambio en la composición de especies entre hábitats o a lo largo de un gradiente: β = γ/α. La diversidad gamma (γ) es la diversidad total de una región o paisaje. Whittaker introdujo estos términos en 1960 para analizar la diversidad a múltiples escalas espaciales."},
{cat:"Cuestionario Smith & Smith – Cap. 23", q:"¿Cuáles son algunos de los factores que dificultan la cuantificación de los patrones de diversidad/riqueza de especies?", a:"Uno de los patrones más consistentes en la ecología es el gradiente latitudinal de diversidad: la riqueza de especies generalmente aumenta del polo al ecuador, para casi todos los grupos taxonómicos (plantas, insectos, aves, mamíferos, reptiles, anfibios). Hipótesis explicativas: 1) Hipótesis de energía-productividad: más energía solar → más productividad → más especies. 2) Hipótesis de estabilidad climática histórica: los trópicos tuvieron menos glaciaciones y extincciones masivas. 3) Hipótesis de tasa de especiación: mayor temperatura acelera la evolución. 4) Mayor área tropical."},
{cat:"Cuestionario Smith & Smith – Cap. 9", q:"¿Qué relación debe existir entre la tasas de suministro y con sumo para que el consumo de un recurso sea sostenible?", a:"La competencia intraespecífica ocurre entre individuos de la misma especie que compiten por los mismos recursos limitantes. Es el principal mecanismo de regulación dependiente de la densidad. Se manifiesta como: reducción de la tasa de crecimiento individual (ej. plantas más pequeñas a mayor densidad), reducción de la fecundidad, aumento de la mortalidad. La competencia puede ser por explotación (consumo compartido del recurso) o por interferencia directa (agresión, territorialidad)."},
{cat:"Cuestionario Smith & Smith – Cap. 9", q:"¿De qué modo puede el uso sostenible de los recursos estar limitado indirectamente por consecuencias adversas a partir de la gestión, extracción y consumo de recursos?", a:"La competencia intraespecífica ocurre entre individuos de la misma especie que compiten por los mismos recursos limitantes. Es el principal mecanismo de regulación dependiente de la densidad. Se manifiesta como: reducción de la tasa de crecimiento individual (ej. plantas más pequeñas a mayor densidad), reducción de la fecundidad, aumento de la mortalidad. La competencia puede ser por explotación (consumo compartido del recurso) o por interferencia directa (agresión, territorialidad)."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Cuáles son los principales ingresos de energía (por producción) para cada uno?", a:"Los organismos ectotérmicos (poiquilotermos) dependen del calor externo para regular su temperatura corporal: peces, reptiles, anfibios, invertebrados. Su tasa metabólica varía con la temperatura ambiental (Q₁₀ ≈ 2: por cada 10°C de aumento, la tasa metabólica se duplica). Los endotérmicos (homeotérmicos) generan calor interno (mediante el metabolismo) y mantienen temperatura corporal constante: mamíferos y aves. Los endotérmicos gastan 10 veces más energía pero pueden estar activos en mayor rango térmico."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Qué método agrícola (industrial o tradicional) produce el mayor rendimiento de cultivos por unidad de superficie?", a:"La energía solar es el motor del clima de la Tierra. La cantidad de radiación solar que recibe una superficie depende del ángulo de incidencia (que varía con la latitud y la estación). En el ecuador, el sol incide casi perpendicularmente, concentrando más energía por unidad de área. En los polos, la misma cantidad de energía se distribuye sobre un área mayor, generando temperaturas más bajas. Esta diferencia de calentamiento genera los grandes patrones de circulación atmosférica y oceánica."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿Qué es el rendimiento sostenible?", a:"El rendimiento máximo sostenible (MSY, Maximum Sustainable Yield) es la máxima cantidad de individuos que se pueden extraer de una población sin reducir su capacidad de recuperación. Se obtiene cuando la población está en N = K/2, donde la tasa de crecimiento neta (dN/dt) es máxima. Es el fundamento del manejo pesquero y forestal. Sin embargo, el MSY asume que K y r son constantes, lo que rara vez ocurre en ecosistemas reales."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿A qué se denomina rendimiento máximo sostenible?", a:"El rendimiento máximo sostenible (MSY, Maximum Sustainable Yield) es la máxima cantidad de individuos que se pueden extraer de una población sin reducir su capacidad de recuperación. Se obtiene cuando la población está en N = K/2, donde la tasa de crecimiento neta (dN/dt) es máxima. Es el fundamento del manejo pesquero y forestal. Sin embargo, el MSY asume que K y r son constantes, lo que rara vez ocurre en ecosistemas reales."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿Qué diferencias existen entre estos dos conceptos?", a:"Una comunidad ecológica es el conjunto de poblaciones de diferentes especies que coexisten en un mismo lugar al mismo tiempo. Las comunidades son sistemas integrados: las interacciones entre las especies (competencia, depredación, mutualismo, parasitismo) determinan la composición, estructura y dinámica de la comunidad. Existen dos visiones: la visión clementsiana (la comunidad como superorganismo integrado con límites netos) y la visión gleassoniana (la comunidad como asociación individualista sin límites definidos)."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Por qué es importante abordar a la comunidad en la gestión de las pesquerías, más que abordar la gestión y la captura de cada especie de manera aislada?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 24", q:"¿Por qué los economistas descuentan los beneficios futuros?", a:"La biodiversidad comprende tres niveles: diversidad genética (variación dentro de una especie), diversidad de especies (número y distribución de especies) y diversidad de ecosistemas (variedad de hábitats y ecosistemas). El valor de la biodiversidad incluye: valor de uso directo (alimentos, medicamentos, materiales), valor de uso indirecto (servicios ecosistémicos: purificación del agua, regulación del clima, polinización), valor de opción (posibles usos futuros), y valor de existencia (valor intrínseco independiente del uso humano)."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Cuál es la consecuencia de realizar descuentos en la gestión de recursos sostenible?", a:"Los individuos de una población pueden distribuirse de tres formas: 1) Distribución aleatoria: la presencia de un individuo en un lugar no afecta la probabilidad de encontrar otro. Es la menos común en la naturaleza. 2) Distribución uniforme o regular: los individuos están equidistantes entre sí, típica donde hay territorialidad o alelopatía. 3) Distribución agrupada o en parches: la más común en la naturaleza; los individuos se agrupan por recursos, comportamiento social o reproducción vegetativa."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Por qué la contaminación del aire ocasionada por las plantas cuya energía proviene de la combustión del carbón es una externalidad?", a:"La luz solar es la fuente de energía para la fotosíntesis: 6CO₂ + 6H₂O + energía lumínica → C₆H₁₂O₆ + 6O₂. Las plantas absorben principalmente luz roja (650-700 nm) y azul (430-450 nm) mediante la clorofila a y b. La luz verde es reflejada (por eso las plantas son verdes). La intensidad lumínica determina la tasa fotosintética hasta un punto de saturación, después del cual no aumenta (fotoinhibición en exceso). Las plantas de sombra tienen menor punto de saturación que las de sol."},
{cat:"Cuestionario Smith & Smith – Cap. 20", q:"¿Cuál es la causa principal de las extinciones de especies actuales?", a:"La selva tropical lluviosa (tropical rainforest) se localiza en latitudes ecuatoriales (América Central y Sur, África central, Sudeste Asiático). Clima: temperatura >25°C todo el año, precipitación >2000 mm/año bien distribuida. Alberga más del 50% de las especies terrestres en solo el 7% de la superficie. Alta estratificación vertical: dosel (25-40 m), subdosel, sotobosque y suelo. Suelos pobres (oxisoles): los nutrientes están en la biomasa, no en el suelo. Alta NPP (~2000-2200 g C m⁻² año⁻¹). Principal amenaza: deforestación."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué es una especie endémica?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué es un punto caliente de biodiversidad?", a:"La ecología incluye varias subdisciplinas: ecología fisiológica (respuestas de individuos a condiciones ambientales), ecología de poblaciones (dinámica de grupos de una especie), ecología de comunidades (interacciones entre especies), ecología de ecosistemas (flujo de energía y ciclo de nutrientes), ecología del paisaje (patrones espaciales), y macroecología (patrones globales de biodiversidad). La ecología aplicada incluye biología de la conservación, manejo de vida silvestre, restauración ecológica y ecología urbana."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué papel desempeñan potencialmente en los esfuerzos de conservación?", a:"La ecología incluye varias subdisciplinas: ecología fisiológica (respuestas de individuos a condiciones ambientales), ecología de poblaciones (dinámica de grupos de una especie), ecología de comunidades (interacciones entre especies), ecología de ecosistemas (flujo de energía y ciclo de nutrientes), ecología del paisaje (patrones espaciales), y macroecología (patrones globales de biodiversidad). La ecología aplicada incluye biología de la conservación, manejo de vida silvestre, restauración ecológica y ecología urbana."},

]; // FIN de flashcards

/* ══════════════════════════════════════════════════
   ESTADO DE LA APP
══════════════════════════════════════════════════ */
let deck = [...flashcards];
let idx = 0;
let isFlipped = false;
let activeCategory = 'Todas';
let searchQuery = '';
let known = new Set();
let dontKnow = new Set();
let seen = new Set();
let currentView = 'study';

/* ══════════════════════════════════════════════════
   INICIALIZACIÓN
══════════════════════════════════════════════════ */
function init() {
  buildSidebar();
  buildGridView();
  renderCard();
  updateProgress();
  updateStats();
}

function getFilteredDeck() {
  return flashcards.filter(c => {
    const matchCat = activeCategory === 'Todas' || c.cat === activeCategory;
    const matchSearch = !searchQuery || 
      c.q.toLowerCase().includes(searchQuery.toLowerCase()) ||
      c.a.toLowerCase().includes(searchQuery.toLowerCase());
    return matchCat && matchSearch;
  });
}

/* ══════════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════════ */
function buildSidebar() {
  const cats = ['Todas', ...new Set(flashcards.map(c => c.cat))];
  const list = document.getElementById('catList');
  const icons = {
    'Todas': '📚', 'Introducción': '🌍', 'Clima & Factores Abióticos': '🌡️',
    'Luz, Agua & Suelo': '💧', 'Adaptaciones': '🦎', 'Poblaciones – Básico': '👥',
    'Crecimiento Poblacional': '📈', 'Regulación Poblacional': '⚖️',
    'Competencia': '⚔️', 'Depredación': '🦁', 'Parasitismo & Enfermedad': '🦠',
    'Mutualismo & Comensalismo': '🤝', 'Comunidades': '🌐',
    'Sucesión': '🌱', 'Energía & Tróficos': '⚡', 'Ciclos Biogeoquímicos': '♻️',
    'Biomas Terrestres': '🌲', 'Ecosistemas Acuáticos': '🌊',
    'Biogeografía': '🗺️', 'Conservación': '🛡️', 'Paisaje & Escala': '🏔️',
    'Cambio Global': '🌡️', 'Evolución & Ecología': '🧬',
    'Comportamiento': '🧠', 'Ecología Humana': '🏙️'
  };
  list.innerHTML = cats.map(cat => {
    const count = cat === 'Todas' ? flashcards.length : flashcards.filter(c => c.cat === cat).length;
    return `<button class="cat-btn ${activeCategory === cat ? 'active' : ''}" onclick="selectCategory('${cat}')">
      <span class="cat-icon">${icons[cat] || '📋'}</span>
      ${cat}
      <span class="cat-count">${count}</span>
    </button>`;
  }).join('');
}

function selectCategory(cat) {
  activeCategory = cat;
  idx = 0;
  isFlipped = false;
  deck = getFilteredDeck();
  buildSidebar();
  renderCard();
  buildGridView();
  updateProgress();
  updateStats();
}

/* ══════════════════════════════════════════════════
   RENDERIZADO DE TARJETA
══════════════════════════════════════════════════ */
function renderCard() {
  deck = getFilteredDeck();
  if (deck.length === 0) {
    document.getElementById('frontText').textContent = 'Sin tarjetas en esta categoría';
    document.getElementById('backText').textContent = '';
    document.getElementById('frontCat').textContent = 'Vacío';
    document.getElementById('backCat').textContent = 'Vacío';
    document.getElementById('cardNum').textContent = '0 / 0';
    document.getElementById('counterDisplay').textContent = '0/0';
    return;
  }
  if (idx >= deck.length) idx = deck.length - 1;
  if (idx < 0) idx = 0;
  const card = deck[idx];
  document.getElementById('frontText').textContent = card.q;
  document.getElementById('backText').textContent = card.a;
  document.getElementById('frontCat').textContent = card.cat;
  document.getElementById('backCat').textContent = card.cat;
  document.getElementById('cardNum').textContent = `${idx + 1} / ${deck.length}`;
  document.getElementById('counterDisplay').textContent = `${idx + 1}/${deck.length}`;
  seen.add(globalIdx(card));
  updateProgress();
  updateStats();
  // Reset flip
  if (isFlipped) {
    document.getElementById('cardWrapper').classList.remove('flipped');
    isFlipped = false;
  }
  clearFeedback();
}

function globalIdx(card) {
  return flashcards.findIndex(c => c.q === card.q && c.cat === card.cat);
}

/* ══════════════════════════════════════════════════
   NAVEGACIÓN
══════════════════════════════════════════════════ */
function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('cardWrapper').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  deck = getFilteredDeck();
  if (deck.length === 0) return;
  idx = (idx + 1) % deck.length;
  renderCard();
}

function prevCard() {
  deck = getFilteredDeck();
  if (deck.length === 0) return;
  idx = (idx - 1 + deck.length) % deck.length;
  renderCard();
}

function markCard(isKnown) {
  deck = getFilteredDeck();
  if (deck.length === 0) return;
  const card = deck[idx];
  const gi = globalIdx(card);
  if (isKnown) {
    known.add(gi);
    dontKnow.delete(gi);
    showFeedback('know', '✓ ¡Lo dominas!');
  } else {
    dontKnow.add(gi);
    known.delete(gi);
    showFeedback('dontknow', '✗ Sigue practicando');
  }
  updateStats();
  setTimeout(nextCard, 500);
}

function shuffle() {
  deck = getFilteredDeck();
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  renderCard();
  showToast('🔀 ¡Tarjetas mezcladas!');
}

function resetProgress() {
  known.clear();
  dontKnow.clear();
  seen.clear();
  idx = 0;
  isFlipped = false;
  updateProgress();
  updateStats();
  buildGridView();
  renderCard();
  showToast('↺ Progreso reiniciado');
}

/* ══════════════════════════════════════════════════
   BARRA DE PROGRESO Y ESTADÍSTICAS
══════════════════════════════════════════════════ */
function updateProgress() {
  const pct = flashcards.length > 0 ? (seen.size / flashcards.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function updateStats() {
  document.getElementById('sSeen').textContent = seen.size;
  document.getElementById('sKnown').textContent = known.size;
  document.getElementById('sDontKnow').textContent = dontKnow.size;
  document.getElementById('sLeft').textContent = flashcards.length - seen.size;
}

/* ══════════════════════════════════════════════════
   BÚSQUEDA
══════════════════════════════════════════════════ */
function onSearch(val) {
  searchQuery = val;
  idx = 0;
  deck = getFilteredDeck();
  renderCard();
  buildGridView();
}

/* ══════════════════════════════════════════════════
   VISTA CUADRÍCULA
══════════════════════════════════════════════════ */
function buildGridView() {
  const d = getFilteredDeck();
  const grid = document.getElementById('gridView');
  grid.innerHTML = d.map((c, i) => {
    const gi = flashcards.findIndex(f => f.q === c.q && f.cat === c.cat);
    const cls = known.has(gi) ? 'grid-card known' : 'grid-card';
    return `<div class="${cls}" id="gc-${i}">
      <div class="gc-cat">${c.cat}</div>
      <div class="gc-q">${c.q}</div>
      <div class="gc-a" id="gca-${i}">${c.a}</div>
      <div class="gc-toggle" onclick="toggleGcAnswer(${i})">Ver respuesta ▼</div>
    </div>`;
  }).join('');
}

function toggleGcAnswer(i) {
  const ans = document.getElementById('gca-' + i);
  const tog = ans.nextElementSibling;
  if (ans.classList.contains('show')) {
    ans.classList.remove('show');
    tog.textContent = 'Ver respuesta ▼';
  } else {
    ans.classList.add('show');
    tog.textContent = 'Ocultar ▲';
  }
}

/* ══════════════════════════════════════════════════
   CAMBIO DE VISTA
══════════════════════════════════════════════════ */
function setView(v) {
  currentView = v;
  document.getElementById('studyView').classList.toggle('hide', v !== 'study');
  document.getElementById('gridView').classList.toggle('show', v === 'grid');
  document.getElementById('btnStudy').classList.toggle('active', v === 'study');
  document.getElementById('btnGrid').classList.toggle('active', v === 'grid');
}

/* ══════════════════════════════════════════════════
   FEEDBACK Y TOAST
══════════════════════════════════════════════════ */
let feedbackTimer = null;
function showFeedback(cls, msg) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback ' + cls;
  if (feedbackTimer) clearTimeout(feedbackTimer);
  feedbackTimer = setTimeout(clearFeedback, 2000);
}
function clearFeedback() {
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ══════════════════════════════════════════════════
   TECLADO
══════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === 'ArrowLeft') prevCard();
  else if (e.key.toLowerCase() === 'k') markCard(true);
  else if (e.key.toLowerCase() === 'n') markCard(false);
  else if (e.key.toLowerCase() === 's') shuffle();
});

/* ══════════════════════════════════════════════════
   ARRANQUE
══════════════════════════════════════════════════ */
init();
</script>
</body>
</html>
