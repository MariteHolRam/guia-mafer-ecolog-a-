{cat:"Cuestionario Smith & Smith – Cap. 5", q:"¿Qué condiciones se requieren para que se produzca la selección natural?", a:"Una adaptación es un rasgo heredable que aumenta la aptitud darwiniana (fitness) de un individuo en su ambiente particular. Las adaptaciones son el resultado de la selección natural actuando sobre la variación genética durante generaciones. Pueden ser morfológicas (forma del cuerpo, coloración), fisiológicas (osmorregulación, termorregulación) o conductuales (migración, comunicación). No todas las características de un organismo son adaptaciones: algunas son restricciones evolutivas o efectos secundarios de otras adaptaciones."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿a qué conclusión es posible llegar con respecto al color de ojos del padre y la madre, si la niña naciera con ojos azules?", a:"La ecología utiliza el método científico: observación, formulación de hipótesis, predicción, experimentación y conclusión. Las hipótesis deben ser falsificables (Popper). Los estudios ecológicos incluyen experimentos de campo, experimentos de laboratorio, modelos matemáticos y observaciones a largo plazo. La replicación, el control y la aleatorización son esenciales para inferencias válidas. Los estudios observacionales son comunes cuando no es posible manipular el sistema, pero dificultan la inferencia causal."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Qué se puede afirmar sobre los genotipos (del color de ojos) de los padres y de la niña, respectiva mente?", a:"El microclima es el conjunto de condiciones climáticas locales que difieren del clima regional. Factores como el relieve, la orientación (norte vs. sur), la cobertura vegetal, el color del suelo y la presencia de agua crean variaciones microclimáticas. Bajo una roca, la temperatura puede ser 10°C menor que la del aire. El interior de un bosque puede ser 5°C más fresco y 20% más húmedo que el claro adyacente. Los organismos explotan los microclimas para regular su temperatura."},
{cat:"Cuestionario Smith & Smith – Cap. 5", q:"¿Cuáles son las dos fuentes principales de variación genética en una población de reproducción sexual?", a:"Una adaptación es un rasgo heredable que aumenta la aptitud darwiniana (fitness) de un individuo en su ambiente particular. Las adaptaciones son el resultado de la selección natural actuando sobre la variación genética durante generaciones. Pueden ser morfológicas (forma del cuerpo, coloración), fisiológicas (osmorregulación, termorregulación) o conductuales (migración, comunicación). No todas las características de un organismo son adaptaciones: algunas son restricciones evolutivas o efectos secundarios de otras adaptaciones."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿es posible concluir que las poblaciones de la isla y del continente son especies diferentes?", a:"Una comunidad ecológica es el conjunto de poblaciones de diferentes especies que coexisten en un mismo lugar al mismo tiempo. Las comunidades son sistemas integrados: las interacciones entre las especies (competencia, depredación, mutualismo, parasitismo) determinan la composición, estructura y dinámica de la comunidad. Existen dos visiones: la visión clementsiana (la comunidad como superorganismo integrado con límites netos) y la visión gleassoniana (la comunidad como asociación individualista sin límites definidos)."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué es la plasticidad fenotípica?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué es un pool genético?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Cuáles son las diferencias entre los conceptos de especie morfológica y biológica?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 23", q:"¿Qué es la especiación?", a:"Uno de los patrones más consistentes en la ecología es el gradiente latitudinal de diversidad: la riqueza de especies generalmente aumenta del polo al ecuador, para casi todos los grupos taxonómicos (plantas, insectos, aves, mamíferos, reptiles, anfibios). Hipótesis explicativas: 1) Hipótesis de energía-productividad: más energía solar → más productividad → más especies. 2) Hipótesis de estabilidad climática histórica: los trópicos tuvieron menos glaciaciones y extincciones masivas. 3) Hipótesis de tasa de especiación: mayor temperatura acelera la evolución. 4) Mayor área tropical."},
{cat:"Cuestionario Smith & Smith – Cap. 5", q:"¿Cómo difiere la evolución de la selección natural?", a:"Una adaptación es un rasgo heredable que aumenta la aptitud darwiniana (fitness) de un individuo en su ambiente particular. Las adaptaciones son el resultado de la selección natural actuando sobre la variación genética durante generaciones. Pueden ser morfológicas (forma del cuerpo, coloración), fisiológicas (osmorregulación, termorregulación) o conductuales (migración, comunicación). No todas las características de un organismo son adaptaciones: algunas son restricciones evolutivas o efectos secundarios de otras adaptaciones."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿Cómo difiere la disponibilidad de luz en el suelo del bos que al mediodía en uno y otro?", a:"El pH del suelo (medida de acidez/alcalinidad en escala 1-14) determina la disponibilidad de nutrientes para las plantas. La mayoría de las plantas crecen mejor entre pH 6-7. En suelos ácidos (pH<5.5), el aluminio y el manganeso se solubilizan y pueden ser tóxicos; el fósforo, calcio y magnesio son menos disponibles. En suelos alcalinos (pH>8), el hierro, manganeso, zinc y boro son menos disponibles. Los nutrientes esenciales incluyen macronutrientes (N, P, K, Ca, Mg, S) y micronutrientes (Fe, Mn, Zn, Cu, B, Mo, Cl)."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿En cuál las hojas que cre cen al fondo de la bóveda (a menor altura en el árbol) reciben más luz a media mañana?", a:"El microclima es el conjunto de condiciones climáticas locales que difieren del clima regional. Factores como el relieve, la orientación (norte vs. sur), la cobertura vegetal, el color del suelo y la presencia de agua crean variaciones microclimáticas. Bajo una roca, la temperatura puede ser 10°C menor que la del aire. El interior de un bosque puede ser 5°C más fresco y 20% más húmedo que el claro adyacente. Los organismos explotan los microclimas para regular su temperatura."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿Cuál es la forma habitual de la curva que describe la ate nuación vertical de luz en la bóveda vegetal de acuerdo con la ley de Beer?", a:"Cuando los recursos son ilimitados, una población crece a su tasa intrínseca máxima de incremento (r). El crecimiento exponencial se describe por: dN/dt = rN, cuya solución es Nt = N₀eʳᵗ. La tasa r = tasa de natalidad per cápita (b) − tasa de mortalidad per cápita (d). La curva de crecimiento exponencial tiene forma de J. Es insostenible a largo plazo porque los recursos son finitos. Ocurre en situaciones de colonización, recuperación post-catástrofe o introducción de especies exóticas."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Por qué no se trata de una linea recta (lineal)?", a:"Las curvas de supervivencia representan gráficamente el lx (supervivientes) en función de la edad: Tipo I: alta supervivencia durante la mayor parte de la vida, mortalidad concentrada en edades avanzadas. Típica de mamíferos grandes y humanos. Tipo II: tasa de mortalidad constante en todas las edades; la curva es una línea recta en escala logarítmica. Típica de aves y algunos reptiles. Tipo III: alta mortalidad en etapas juveniles, supervivencia muy alta en adultos. Típica de peces, árboles, ostras y muchos invertebrados."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿Qué cinco factores principales afectan la formación de suelos?", a:"El suelo es un sistema complejo que se forma por la meteorización física y química de la roca madre, combinada con la acumulación de materia orgánica. Los factores de formación del suelo (Jenny, 1941) son: material parental (roca madre), clima (el más importante a escala global), organismos (vegetación, fauna, microorganismos), topografía y tiempo. La formación de un centímetro de suelo productivo puede requerir cientos a miles de años."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿Qué rol juega la meteorización en la formación de suelos?", a:"El suelo es un sistema complejo que se forma por la meteorización física y química de la roca madre, combinada con la acumulación de materia orgánica. Los factores de formación del suelo (Jenny, 1941) son: material parental (roca madre), clima (el más importante a escala global), organismos (vegetación, fauna, microorganismos), topografía y tiempo. La formación de un centímetro de suelo productivo puede requerir cientos a miles de años."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿Qué factores participan en el proceso de meteorización?", a:"El suelo es un sistema complejo que se forma por la meteorización física y química de la roca madre, combinada con la acumulación de materia orgánica. Los factores de formación del suelo (Jenny, 1941) son: material parental (roca madre), clima (el más importante a escala global), organismos (vegetación, fauna, microorganismos), topografía y tiempo. La formación de un centímetro de suelo productivo puede requerir cientos a miles de años."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Cuál es el factor más importante que diferencia el horizonte O del A?", a:"La energía solar es el motor del clima de la Tierra. La cantidad de radiación solar que recibe una superficie depende del ángulo de incidencia (que varía con la latitud y la estación). En el ecuador, el sol incide casi perpendicularmente, concentrando más energía por unidad de área. En los polos, la misma cantidad de energía se distribuye sobre un área mayor, generando temperaturas más bajas. Esta diferencia de calentamiento genera los grandes patrones de circulación atmosférica y oceánica."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿Por qué los suelos de arcilla habitualmente cuentan con una mayor capacidad de intercambio catiónico que los de arena?", a:"La textura del suelo refiere a las proporciones de arena (partículas >0.05 mm), limo (0.002-0.05 mm) y arcilla (<0.002 mm). Los suelos arenosos tienen buen drenaje pero baja retención de agua y nutrientes. Los suelos arcillosos retienen mucha agua y nutrientes pero con mal drenaje. Los suelos francos (mezcla equilibrada) son los más productivos. La capacidad de intercambio catiónico (CIC) es la capacidad del suelo de retener cationes nutritivos (Ca²⁺, K⁺, Mg²⁺, NH₄⁺)."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿Cómo afecta el pH a la saturación básica de un suelo?", a:"El pH del suelo (medida de acidez/alcalinidad en escala 1-14) determina la disponibilidad de nutrientes para las plantas. La mayoría de las plantas crecen mejor entre pH 6-7. En suelos ácidos (pH<5.5), el aluminio y el manganeso se solubilizan y pueden ser tóxicos; el fósforo, calcio y magnesio son menos disponibles. En suelos alcalinos (pH>8), el hierro, manganeso, zinc y boro son menos disponibles. Los nutrientes esenciales incluyen macronutrientes (N, P, K, Ca, Mg, S) y micronutrientes (Fe, Mn, Zn, Cu, B, Mo, Cl)."},
{cat:"Cuestionario Smith & Smith – Cap. 28", q:"¿Por qué el proceso de salinización predomina en las zonas áridas?", a:"La desertificación es la degradación de tierras en zonas áridas, semiáridas y subhúmedas resultante de la variabilidad climática y las actividades humanas. Causas principales: sobrepastoreo (destruye la cubierta vegetal y compacta el suelo), deforestación, agricultura de secano en suelos marginales, riego inadecuado (salinización). Consecuencias: pérdida de cubierta vegetal, erosión del suelo (eólica e hídrica), reducción de la productividad, pérdida de biodiversidad y degradación socioeconómica. Afecta a ~2000 millones de personas en más de 100 países."},
{cat:"Cuestionario Smith & Smith – Cap. 11", q:"¿Cómo aumenta la irrigación el proceso de salinización en las zonas agrícolas?", a:"La respuesta funcional (Holling, 1959) describe cómo la tasa de consumo de un depredador cambia con la densidad de presas. Tipo I: la tasa de consumo aumenta linealmente con la densidad de presa hasta un máximo (filtración: mejillones, dafnia). Tipo II (más común): la tasa de consumo aumenta pero con saturación (curva hiperbólica) porque cada presa requiere tiempo de manejo; es desestabilizante. Tipo III: sigmoide; la tasa de consumo es baja a densidades bajas (búsqueda de imagen), aumenta rápidamente y se satura; es estabilizante."},
{cat:"Cuestionario Smith & Smith – Cap. 16", q:"¿Qué proceso de formación de suelos predomina en las regiones tropicales húmedas?", a:"La sucesión ecológica es el proceso de cambio direccional y predecible en la composición y estructura de una comunidad a lo largo del tiempo. Sucesión primaria: ocurre en áreas sin suelo ni biota previa: flujos de lava, dunas nuevas, superficies glaciares. Es lenta porque requiere formación de suelo. Sucesión secundaria: ocurre en áreas perturbadas donde queda suelo y banco de semillas: campos abandonados, zonas quemadas, bosques talados. Es más rápida porque la base del suelo ya existe."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿Cómo afecta este proceso a la disponibilidad de nutrientes para las raíces de plantas en el horizonte A?", a:"El pH del suelo (medida de acidez/alcalinidad en escala 1-14) determina la disponibilidad de nutrientes para las plantas. La mayoría de las plantas crecen mejor entre pH 6-7. En suelos ácidos (pH<5.5), el aluminio y el manganeso se solubilizan y pueden ser tóxicos; el fósforo, calcio y magnesio son menos disponibles. En suelos alcalinos (pH>8), el hierro, manganeso, zinc y boro son menos disponibles. Los nutrientes esenciales incluyen macronutrientes (N, P, K, Ca, Mg, S) y micronutrientes (Fe, Mn, Zn, Cu, B, Mo, Cl)."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué significa decir que la vida sobre la Tierra está basa da en el carbono?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Cómo se relacionan?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Cuál es la función de la respiración?", a:"El punto de compensación lumínica es la intensidad de luz a la cual la tasa de fotosíntesis bruta iguala a la tasa de respiración, resultando en un intercambio neto de CO₂ de cero. Por encima de este punto, la planta tiene ganancia neta de carbono. Las plantas de sombra tienen puntos de compensación muy bajos (pueden fotosintizar a baja luz) mientras que las de sol tienen puntos de compensación más altos y tasas fotosintéticas máximas mucho mayores."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Cuál es el papel de la luz (PAR) en el proceso de la foto síntesis?", a:"La luz solar es la fuente de energía para la fotosíntesis: 6CO₂ + 6H₂O + energía lumínica → C₆H₁₂O₆ + 6O₂. Las plantas absorben principalmente luz roja (650-700 nm) y azul (430-450 nm) mediante la clorofila a y b. La luz verde es reflejada (por eso las plantas son verdes). La intensidad lumínica determina la tasa fotosintética hasta un punto de saturación, después del cual no aumenta (fotoinhibición en exceso). Las plantas de sombra tienen menor punto de saturación que las de sol."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Por qué se produce?", a:"Cuando los vientos húmedos ascienden por una cadena montañosa (barlovento), el aire se enfría y precipita. Al descender por el lado opuesto (sotavento), el aire seco produce condiciones áridas (sombra orográfica o rain shadow). Este efecto explica la presencia de desiertos adyacentes a montañas como los Andes (Atacama), las Cascadas (Gran Cuenca), el Himalaya y los Alpes. Las montañas crean gradientes climáticos pronunciados en distancias cortas."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿cómo piensas que varía la fotosíntesis a lo largo del día?", a:"El fotoperiodismo es la respuesta de los organismos a la duración relativa del día y la noche (fotoperiodo). En plantas, controla la floración: plantas de día largo (florecen cuando el día supera un umbral crítico: cereales, espinacas), plantas de día corto (florecen cuando el día es corto: crisantemos, café), y plantas neutras (no responden al fotoperiodo: tomate). En animales, el fotoperiodo regula la reproducción estacional, la migración, la muda y la hibernación."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿De qué manera la difusión controla la absorción de dióxido de carbono y la pérdida de agua de la hoja?", a:"Las plantas C3 fijan el CO₂ directamente mediante la enzima RuBisCO, produciendo un compuesto de 3 carbonos (3-fosfoglicerato). Son ineficientes a altas temperaturas y baja CO₂ por la fotorrespiración. Las plantas C4 (maíz, caña de azúcar, sorgo) concentran el CO₂ en células del mesófilo antes de enviarlo a las células del haz, eliminando casi la fotorrespiración: son más eficientes en climas cálidos y áridos. Las plantas CAM (cactus, agaves, piñas) abren los estomas de noche para fijar CO₂, minimizando la pérdida de agua."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Cómo modifica la disponibilidad de agua para un vegetal la tasa de fotosíntesis?", a:"El microclima es el conjunto de condiciones climáticas locales que difieren del clima regional. Factores como el relieve, la orientación (norte vs. sur), la cobertura vegetal, el color del suelo y la presencia de agua crean variaciones microclimáticas. Bajo una roca, la temperatura puede ser 10°C menor que la del aire. El interior de un bosque puede ser 5°C más fresco y 20% más húmedo que el claro adyacente. Los organismos explotan los microclimas para regular su temperatura."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Cuál es la ventaja de la ruta fotosintética C4 en comparación con la ruta C3 convencional?", a:"Las plantas C3 fijan el CO₂ directamente mediante la enzima RuBisCO, produciendo un compuesto de 3 carbonos (3-fosfoglicerato). Son ineficientes a altas temperaturas y baja CO₂ por la fotorrespiración. Las plantas C4 (maíz, caña de azúcar, sorgo) concentran el CO₂ en células del mesófilo antes de enviarlo a las células del haz, eliminando casi la fotorrespiración: son más eficientes en climas cálidos y áridos. Las plantas CAM (cactus, agaves, piñas) abren los estomas de noche para fijar CO₂, minimizando la pérdida de agua."},
{cat:"Cuestionario Smith & Smith – Cap. 10", q:"¿Cómo podrían influir estas ventajas en el lugar en el que se hallan estas especies?", a:"La partición de nicho (resource partitioning) es la división de los recursos disponibles entre especies similares que permite su coexistencia, reduciendo la solapamiento de nicho. Puede ocurrir en el espacio (vertical, horizontal), en el tiempo (actividad diurna vs. nocturna), en el tipo de alimento o en el microhábitat. El famoso ejemplo de los piquitos de Darwin en Galápagos muestra cómo especies relacionadas coexisten usando diferentes tamaños de semillas. La partición de nicho es evidencia de exclusión competitiva pasada."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Cuál es la ventaja de un punto de compensación de la luz menor (PCL) para las especies de vegetales adaptadas a los ambientes de baja luminosidad?", a:"El punto de compensación lumínica es la intensidad de luz a la cual la tasa de fotosíntesis bruta iguala a la tasa de respiración, resultando en un intercambio neto de CO₂ de cero. Por encima de este punto, la planta tiene ganancia neta de carbono. Las plantas de sombra tienen puntos de compensación muy bajos (pueden fotosintizar a baja luz) mientras que las de sol tienen puntos de compensación más altos y tasas fotosintéticas máximas mucho mayores."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Cuál es el costo de mantener un PCL bajo?", a:"El agua es esencial para la vida por sus propiedades únicas: alta capacidad calorífica (amortigua cambios de temperatura), calor de vaporización elevado (el sudor enfría eficientemente), cohesión y tensión superficial, expansión al congelarse (el hielo flota, protegiendo los ecosistemas acuáticos), y es el solvente universal. Los organismos deben mantener su balance hídrico: ingesta de agua = pérdida de agua (por evaporación, orina, heces). Las adaptaciones al estrés hídrico son cruciales en ambientes áridos."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Cómo responden los vegetales que crecen en ambientes de sombra para aumentar sus áreas superficiales fotosintéticas?", a:"El punto de compensación lumínica es la intensidad de luz a la cual la tasa de fotosíntesis bruta iguala a la tasa de respiración, resultando en un intercambio neto de CO₂ de cero. Por encima de este punto, la planta tiene ganancia neta de carbono. Las plantas de sombra tienen puntos de compensación muy bajos (pueden fotosintizar a baja luz) mientras que las de sol tienen puntos de compensación más altos y tasas fotosintéticas máximas mucho mayores."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿De qué manera influye una disminución de la disponibilidad de agua en la distribución de carbono (fotosintetatos) en el proceso de crecimiento?", a:"La capacidad de carga (K) es el tamaño máximo de población que el ambiente puede sostener de manera indefinida, determinado por la disponibilidad de recursos. El crecimiento logístico, modelado por Verhulst, incorpora la resistencia ambiental: dN/dt = rN[(K-N)/K]. La población crece en forma de S (sigmoide): fase de aceleración (N«K), fase de desaceleración (N→K) y fase de meseta (N≈K). La tasa de crecimiento per cápita (r·(K-N)/K) disminuye linealmente con N."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Cómo podría la longevidad foliar aumentada (hojas con una vida más prolongada) funcionar como una adaptación a los ambientes de bajo contenido en nutrientes?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 11", q:"¿Cuál es la diferencia entre un modelo de crecimiento poblacional separado (DN/Dt) y continuo (dN/dt)?", a:"El modelo Lotka-Volterra para la interacción depredador-presa describe: dN/dt = rN − aNP (presa) y dP/dt = baNP − mP (depredador), donde N = abundancia de presa, P = abundancia de depredador, r = tasa de crecimiento de la presa, a = tasa de ataque del depredador, b = eficiencia de conversión de presa a descendencia del depredador, m = tasa de mortalidad del depredador. Las soluciones generan oscilaciones cíclicas neutras (ciclos de Lotka-Volterra). El ciclo liebre-lince se ajusta cualitativamente a este modelo."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿Cuál es la diferencia entre crecimiento geométrico y exponencial?", a:"Cuando los recursos son ilimitados, una población crece a su tasa intrínseca máxima de incremento (r). El crecimiento exponencial se describe por: dN/dt = rN, cuya solución es Nt = N₀eʳᵗ. La tasa r = tasa de natalidad per cápita (b) − tasa de mortalidad per cápita (d). La curva de crecimiento exponencial tiene forma de J. Es insostenible a largo plazo porque los recursos son finitos. Ocurre en situaciones de colonización, recuperación post-catástrofe o introducción de especies exóticas."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Qué es una tabla de vida y qué información (datos) se necesitan para construir una?", a:"Una tabla de vida (life table) registra la supervivencia y fecundidad de una cohorte (grupo de individuos nacidos al mismo tiempo) a lo largo de sus vidas. Contiene: lx = probabilidad de sobrevivir hasta la edad x, dx = proporción que muere entre x y x+1, qx = tasa de mortalidad en el intervalo x a x+1, mx = fecundidad (hijas por hembra) en el intervalo x. La tasa neta de reproducción Ro = Σ(lx × mx) es el número promedio de hijas por hembra a lo largo de su vida."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Cómo difieren la tasa reproductiva absoluta y la tasa reproductiva neta?", a:"El punto de compensación lumínica es la intensidad de luz a la cual la tasa de fotosíntesis bruta iguala a la tasa de respiración, resultando en un intercambio neto de CO₂ de cero. Por encima de este punto, la planta tiene ganancia neta de carbono. Las plantas de sombra tienen puntos de compensación muy bajos (pueden fotosintizar a baja luz) mientras que las de sol tienen puntos de compensación más altos y tasas fotosintéticas máximas mucho mayores."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿Cómo puede utilizarse el valor de la tasa reproductiva neta para una población (R0 ) para calcular si una población está creciendo o decreciendo?", a:"El rendimiento máximo sostenible (MSY, Maximum Sustainable Yield) es la máxima cantidad de individuos que se pueden extraer de una población sin reducir su capacidad de recuperación. Se obtiene cuando la población está en N = K/2, donde la tasa de crecimiento neta (dN/dt) es máxima. Es el fundamento del manejo pesquero y forestal. Sin embargo, el MSY asume que K y r son constantes, lo que rara vez ocurre en ecosistemas reales."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Qué presunción debe hacerse sobre las tasas de supervivencia específica de la edad (sx )?", a:"Una tabla de vida (life table) registra la supervivencia y fecundidad de una cohorte (grupo de individuos nacidos al mismo tiempo) a lo largo de sus vidas. Contiene: lx = probabilidad de sobrevivir hasta la edad x, dx = proporción que muere entre x y x+1, qx = tasa de mortalidad en el intervalo x a x+1, mx = fecundidad (hijas por hembra) en el intervalo x. La tasa neta de reproducción Ro = Σ(lx × mx) es el número promedio de hijas por hembra a lo largo de su vida."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Cómo se calcula el multiplicador de crecimiento finito (l) a partir de la tabla de proyección poblacional?", a:"Una población es un grupo de individuos de la misma especie que viven en la misma área al mismo tiempo y que pueden entrecruzarse. Los atributos de la población incluyen: tamaño (N), densidad (N por unidad de área), distribución espacial (cómo se distribuyen los individuos en el espacio), estructura de edades, tasa de natalidad (b), tasa de mortalidad (d), tasa de inmigración (i) y tasa de emigración (e). La tasa de crecimiento de la población es: ΔN/Δt = (b-d) + (i-e)."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Cómo utilizarse el multiplicador de crecimiento finito para predecir los valores futuros de la densidad poblacional, N(t)?", a:"Una población es un grupo de individuos de la misma especie que viven en la misma área al mismo tiempo y que pueden entrecruzarse. Los atributos de la población incluyen: tamaño (N), densidad (N por unidad de área), distribución espacial (cómo se distribuyen los individuos en el espacio), estructura de edades, tasa de natalidad (b), tasa de mortalidad (d), tasa de inmigración (i) y tasa de emigración (e). La tasa de crecimiento de la población es: ΔN/Δt = (b-d) + (i-e)."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿Qué factores ambientales podrían dar variaciones alea torias anuales en las tasas de supervivencia y natalidad en una población?", a:"Los factores dependientes de la densidad ejercen mayor efecto (tasa de mortalidad mayor o tasa de natalidad menor) cuando la densidad poblacional es alta, y menor efecto a baja densidad. Crean retroalimentación negativa que estabiliza la población alrededor de K. Ejemplos: competencia intraespecífica por alimento (a mayor densidad, menos alimento por individuo), enfermedades y parásitos (se transmiten más fácilmente a alta densidad), depredación territorial (más difícil a alta densidad)."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Cómo podrían estos factores ser influidos por el tamaño poblacional?", a:"Una población es un grupo de individuos de la misma especie que viven en la misma área al mismo tiempo y que pueden entrecruzarse. Los atributos de la población incluyen: tamaño (N), densidad (N por unidad de área), distribución espacial (cómo se distribuyen los individuos en el espacio), estructura de edades, tasa de natalidad (b), tasa de mortalidad (d), tasa de inmigración (i) y tasa de emigración (e). La tasa de crecimiento de la población es: ΔN/Δt = (b-d) + (i-e)."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿Cuál es la diferencia entre los modelos exponencial y logístico de crecimiento poblacional?", a:"Cuando los recursos son ilimitados, una población crece a su tasa intrínseca máxima de incremento (r). El crecimiento exponencial se describe por: dN/dt = rN, cuya solución es Nt = N₀eʳᵗ. La tasa r = tasa de natalidad per cápita (b) − tasa de mortalidad per cápita (d). La curva de crecimiento exponencial tiene forma de J. Es insostenible a largo plazo porque los recursos son finitos. Ocurre en situaciones de colonización, recuperación post-catástrofe o introducción de especies exóticas."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿Cuál es la definición de capacidad de carga (K)?", a:"La capacidad de carga (K) es el tamaño máximo de población que el ambiente puede sostener de manera indefinida, determinado por la disponibilidad de recursos. El crecimiento logístico, modelado por Verhulst, incorpora la resistencia ambiental: dN/dt = rN[(K-N)/K]. La población crece en forma de S (sigmoide): fase de aceleración (N«K), fase de desaceleración (N→K) y fase de meseta (N≈K). La tasa de crecimiento per cápita (r·(K-N)/K) disminuye linealmente con N."},
{cat:"Cuestionario Smith & Smith – Cap. 9", q:"¿Cómo se emplea en el marco del modelo logístico para introdu cir un mecanismo de regulación poblacional dependien te de la densidad?", a:"La competencia intraespecífica ocurre entre individuos de la misma especie que compiten por los mismos recursos limitantes. Es el principal mecanismo de regulación dependiente de la densidad. Se manifiesta como: reducción de la tasa de crecimiento individual (ej. plantas más pequeñas a mayor densidad), reducción de la fecundidad, aumento de la mortalidad. La competencia puede ser por explotación (consumo compartido del recurso) o por interferencia directa (agresión, territorialidad)."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿Cómo difieren la competencia de pelea y de torneo respecto de los efectos que ejercen en el crecimiento (regulación) poblacional?", a:"Los factores dependientes de la densidad ejercen mayor efecto (tasa de mortalidad mayor o tasa de natalidad menor) cuando la densidad poblacional es alta, y menor efecto a baja densidad. Crean retroalimentación negativa que estabiliza la población alrededor de K. Ejemplos: competencia intraespecífica por alimento (a mayor densidad, menos alimento por individuo), enfermedades y parásitos (se transmiten más fácilmente a alta densidad), depredación territorial (más difícil a alta densidad)."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Cómo influye la relación entre el tamaño corporal y el del área de acción en los cálculos de densidad poblacional y abundancia analizados en el Capítulo 9?", a:"Una población es un grupo de individuos de la misma especie que viven en la misma área al mismo tiempo y que pueden entrecruzarse. Los atributos de la población incluyen: tamaño (N), densidad (N por unidad de área), distribución espacial (cómo se distribuyen los individuos en el espacio), estructura de edades, tasa de natalidad (b), tasa de mortalidad (d), tasa de inmigración (i) y tasa de emigración (e). La tasa de crecimiento de la población es: ΔN/Δt = (b-d) + (i-e)."},
{cat:"Cuestionario Smith & Smith – Cap. 9", q:"¿Qué condición debe darse para que la territorialidad funcione como mecanismo de regulación del crecimiento (y la densidad) poblacional dependiente de la densidad?", a:"La competencia intraespecífica ocurre entre individuos de la misma especie que compiten por los mismos recursos limitantes. Es el principal mecanismo de regulación dependiente de la densidad. Se manifiesta como: reducción de la tasa de crecimiento individual (ej. plantas más pequeñas a mayor densidad), reducción de la fecundidad, aumento de la mortalidad. La competencia puede ser por explotación (consumo compartido del recurso) o por interferencia directa (agresión, territorialidad)."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Cómo opera la dominancia social en una población para regular el crecimiento poblacional?", a:"Una población es un grupo de individuos de la misma especie que viven en la misma área al mismo tiempo y que pueden entrecruzarse. Los atributos de la población incluyen: tamaño (N), densidad (N por unidad de área), distribución espacial (cómo se distribuyen los individuos en el espacio), estructura de edades, tasa de natalidad (b), tasa de mortalidad (d), tasa de inmigración (i) y tasa de emigración (e). La tasa de crecimiento de la población es: ΔN/Δt = (b-d) + (i-e)."},
{cat:"Cuestionario Smith & Smith – Cap. 5", q:"¿De qué manera se vincula este concepto con la distribución espacial (dispersión) de la población en una región geográfica?", a:"La Ley de Tolerancia de Shelford (1913) establece que para cada factor ambiental existe un mínimo y un máximo tolerable, y un rango óptimo en el que el organismo prospera. Por debajo del mínimo o por encima del máximo (zona de intolerancia), la especie no puede sobrevivir. Cerca de los extremos (zona de estrés), el organismo sobrevive pero con capacidad reproductiva reducida. El concepto de rango de tolerancia es fundamental para entender la distribución geográfica de las especies."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Cómo influye la tasa de inmigración en el grado en que la dinámica de las poblaciones locales se sincroniza?", a:"Una población es un grupo de individuos de la misma especie que viven en la misma área al mismo tiempo y que pueden entrecruzarse. Los atributos de la población incluyen: tamaño (N), densidad (N por unidad de área), distribución espacial (cómo se distribuyen los individuos en el espacio), estructura de edades, tasa de natalidad (b), tasa de mortalidad (d), tasa de inmigración (i) y tasa de emigración (e). La tasa de crecimiento de la población es: ΔN/Δt = (b-d) + (i-e)."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿Qué efecto presenta la sin cronización de la dinámica local sobre la persistencia metapoblacional?", a:"Los factores independientes de la densidad afectan a las poblaciones sin importar su tamaño. Principalmente eventos climáticos: heladas, sequías, tormentas, inundaciones, erupciones volcánicas. Matan a un porcentaje fijo de la población independientemente de su densidad. No pueden regular la población (no hay retroalimentación), pero pueden reducir drásticamente el tamaño e incluso causar extinción local. Son especialmente importantes en ambientes variables e impredecibles."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿De qué manera influye el tamaño y la organización espa cial de las parcelas de hábitat (poblaciones locales) en la dinámica metapoblacional?", a:"Una metapoblación (Levins, 1970) es un conjunto de poblaciones locales parcialmente aisladas pero conectadas por dispersión. Las poblaciones locales se extinguen y se recolonizan periódicamente. El modelo de Levins: dp/dt = mp(1-p) − ep, donde p es la fracción de parches ocupados, m es la tasa de colonización y e es la tasa de extinción local. El equilibrio p* = 1 - e/m; la metapoblación persiste globalmente si m > e. Fundamental para entender los efectos de la fragmentación del hábitat."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿Cómo influye la heterogeneidad del hábitat en la diná mica de las poblaciones locales?", a:"Una metapoblación (Levins, 1970) es un conjunto de poblaciones locales parcialmente aisladas pero conectadas por dispersión. Las poblaciones locales se extinguen y se recolonizan periódicamente. El modelo de Levins: dp/dt = mp(1-p) − ep, donde p es la fracción de parches ocupados, m es la tasa de colonización y e es la tasa de extinción local. El equilibrio p* = 1 - e/m; la metapoblación persiste globalmente si m > e. Fundamental para entender los efectos de la fragmentación del hábitat."},
{cat:"Cuestionario Smith & Smith – Cap. 27", q:"¿Cómo influye en la importancia de la heterogeneidad del hábitat en las parcelas de hábitat?", a:"La ecología del paisaje estudia las interacciones entre los patrones espaciales del paisaje y los procesos ecológicos. Los elementos del paisaje son: parches (unidades de hábitat homogéneo), corredores (conexiones entre parches) y la matriz (hábitat dominante que rodea los parches). La heterogeneidad del paisaje influye en la biodiversidad, el flujo de organismos, energía y materiales. Los Sistemas de Información Geográfica (SIG) y la teledetección son herramientas fundamentales en ecología del paisaje."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Qué es el efecto salvamento?", a:"La rotación de la Tierra deflexiona los vientos: hacia la derecha en el hemisferio norte, hacia la izquierda en el sur (efecto Coriolis). Esto genera los vientos alisios (del NE en el hemisferio norte, del SE en el sur), los vientos del oeste en latitudes medias y los vientos polares del este. Los alisios convergen en la Zona de Convergencia Intertropical (ZCIT), cerca del ecuador, donde se producen las lluvias tropicales más abundantes."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Bajo qué condiciones resulta importante este efecto?", a:"Cuando los vientos húmedos ascienden por una cadena montañosa (barlovento), el aire se enfría y precipita. Al descender por el lado opuesto (sotavento), el aire seco produce condiciones áridas (sombra orográfica o rain shadow). Este efecto explica la presencia de desiertos adyacentes a montañas como los Andes (Atacama), las Cascadas (Gran Cuenca), el Himalaya y los Alpes. Las montañas crean gradientes climáticos pronunciados en distancias cortas."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué características de una población la definen como una fuente o sumidero potencial?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿Cómo se vincula el concepto de poblaciones fuente y sumidero con la calidad del hábitat?", a:"Muchas poblaciones muestran oscilaciones cíclicas en su abundancia. Los ciclos de 3-4 años son típicos de micromamíferos (lemmings, ratones de campo) en tundra y bosque boreal. Los ciclos de ~10 años son característicos de la liebre de raquetas (Lepus americanus) y el lince canadiense (Lynx canadensis) en la taiga norteamericana. Las causas de los ciclos son debatidas: interacciones depredador-presa, calidad del alimento, respuesta inmune. Los datos de la Compañía de la Bahía de Hudson (1736-1930) documentan el ciclo liebre-lince."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué factores ambientales pueden servir para sincronizar la dinámica de las poblaciones locales de una región?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 10", q:"¿Qué condición(es) debe(n) establecerse antes de que un investigador pueda determinar definitivamente que dos especies compiten por un recurso?", a:"El principio de exclusión competitiva de Gause (1934) afirma que dos especies que compiten por exactamente los mismos recursos en las mismas condiciones no pueden coexistir indefinidamente: la especie competitivamente superior excluye a la otra. Gause lo demostró con experimentos con Paramecium caudatum y P. aurelia cultivados juntos: P. aurelia siempre excluía a P. caudatum porque consumía bacterias más eficientemente. En poblaciones naturales, la coexistencia requiere diferenciación de nicho."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿El hecho de que dos especies se superpongan en la utilización de un recurso es condición suficiente para determinar que ha ocurrido una competencia interespecífica?", a:"Una comunidad ecológica es el conjunto de poblaciones de diferentes especies que coexisten en un mismo lugar al mismo tiempo. Las comunidades son sistemas integrados: las interacciones entre las especies (competencia, depredación, mutualismo, parasitismo) determinan la composición, estructura y dinámica de la comunidad. Existen dos visiones: la visión clementsiana (la comunidad como superorganismo integrado con límites netos) y la visión gleassoniana (la comunidad como asociación individualista sin límites definidos)."},
{cat:"Cuestionario Smith & Smith – Cap. 2", q:"¿Qué condición es necesaria para que ocurra esto?", a:"La rotación de la Tierra deflexiona los vientos: hacia la derecha en el hemisferio norte, hacia la izquierda en el sur (efecto Coriolis). Esto genera los vientos alisios (del NE en el hemisferio norte, del SE en el sur), los vientos del oeste en latitudes medias y los vientos polares del este. Los alisios convergen en la Zona de Convergencia Intertropical (ZCIT), cerca del ecuador, donde se producen las lluvias tropicales más abundantes."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿Cómo podrían influir, factores ambientales tales como temperatura y salinidad, en el resultado de la competencia entre dos especies que ocupan el mismo hábitat?", a:"Una comunidad ecológica es el conjunto de poblaciones de diferentes especies que coexisten en un mismo lugar al mismo tiempo. Las comunidades son sistemas integrados: las interacciones entre las especies (competencia, depredación, mutualismo, parasitismo) determinan la composición, estructura y dinámica de la comunidad. Existen dos visiones: la visión clementsiana (la comunidad como superorganismo integrado con límites netos) y la visión gleassoniana (la comunidad como asociación individualista sin límites definidos)."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿cómo cree que estas tres especies podrían diferir (morfología, tasas máximas de foto síntesis, etc.)?", a:"El punto de compensación lumínica es la intensidad de luz a la cual la tasa de fotosíntesis bruta iguala a la tasa de respiración, resultando en un intercambio neto de CO₂ de cero. Por encima de este punto, la planta tiene ganancia neta de carbono. Las plantas de sombra tienen puntos de compensación muy bajos (pueden fotosintizar a baja luz) mientras que las de sol tienen puntos de compensación más altos y tasas fotosintéticas máximas mucho mayores."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿Qué otros factores no relacionados con la competencia podrían responder a las diferencias observadas?", a:"Los factores dependientes de la densidad ejercen mayor efecto (tasa de mortalidad mayor o tasa de natalidad menor) cuando la densidad poblacional es alta, y menor efecto a baja densidad. Crean retroalimentación negativa que estabiliza la población alrededor de K. Ejemplos: competencia intraespecífica por alimento (a mayor densidad, menos alimento por individuo), enfermedades y parásitos (se transmiten más fácilmente a alta densidad), depredación territorial (más difícil a alta densidad)."},
{cat:"Cuestionario Smith & Smith – Cap. 10", q:"¿Cuáles son las diferencias de cambio de nicho y despla zamiento de carácter?", a:"El principio de exclusión competitiva de Gause (1934) afirma que dos especies que compiten por exactamente los mismos recursos en las mismas condiciones no pueden coexistir indefinidamente: la especie competitivamente superior excluye a la otra. Gause lo demostró con experimentos con Paramecium caudatum y P. aurelia cultivados juntos: P. aurelia siempre excluía a P. caudatum porque consumía bacterias más eficientemente. En poblaciones naturales, la coexistencia requiere diferenciación de nicho."},
{cat:"Cuestionario Smith & Smith – Cap. 10", q:"¿Cuál de estos dos conceptos describe mejor el ejemplo de los pinzones de las Galápagos en la Figura 13.20?", a:"La partición de nicho (resource partitioning) es la división de los recursos disponibles entre especies similares que permite su coexistencia, reduciendo la solapamiento de nicho. Puede ocurrir en el espacio (vertical, horizontal), en el tiempo (actividad diurna vs. nocturna), en el tipo de alimento o en el microhábitat. El famoso ejemplo de los piquitos de Darwin en Galápagos muestra cómo especies relacionadas coexisten usando diferentes tamaños de semillas. La partición de nicho es evidencia de exclusión competitiva pasada."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Por qué?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 11", q:"¿Por qué la población de depredadores que da rezagada detrás de la población de presas). ¿Qué es una respuesta funcional en la depredación?", a:"La respuesta funcional (Holling, 1959) describe cómo la tasa de consumo de un depredador cambia con la densidad de presas. Tipo I: la tasa de consumo aumenta linealmente con la densidad de presa hasta un máximo (filtración: mejillones, dafnia). Tipo II (más común): la tasa de consumo aumenta pero con saturación (curva hiperbólica) porque cada presa requiere tiempo de manejo; es desestabilizante. Tipo III: sigmoide; la tasa de consumo es baja a densidades bajas (búsqueda de imagen), aumenta rápidamente y se satura; es estabilizante."},
{cat:"Cuestionario Smith & Smith – Cap. 11", q:"¿Qué componente del modelo de Lotka-Volterra de dinámica de la relación depredador-presa presentado en el Aparta do 14.2 representa la respuesta funcional?", a:"El modelo Lotka-Volterra para la interacción depredador-presa describe: dN/dt = rN − aNP (presa) y dP/dt = baNP − mP (depredador), donde N = abundancia de presa, P = abundancia de depredador, r = tasa de crecimiento de la presa, a = tasa de ataque del depredador, b = eficiencia de conversión de presa a descendencia del depredador, m = tasa de mortalidad del depredador. Las soluciones generan oscilaciones cíclicas neutras (ciclos de Lotka-Volterra). El ciclo liebre-lince se ajusta cualitativamente a este modelo."},
{cat:"Cuestionario Smith & Smith – Cap. 11", q:"¿Qué tipo de respuesta funcional se incluye en el modelo de Lotka-Volterra de dinámica de la relación depredador-presa presentado en el Apartado 14.2?", a:"El modelo Lotka-Volterra para la interacción depredador-presa describe: dN/dt = rN − aNP (presa) y dP/dt = baNP − mP (depredador), donde N = abundancia de presa, P = abundancia de depredador, r = tasa de crecimiento de la presa, a = tasa de ataque del depredador, b = eficiencia de conversión de presa a descendencia del depredador, m = tasa de mortalidad del depredador. Las soluciones generan oscilaciones cíclicas neutras (ciclos de Lotka-Volterra). El ciclo liebre-lince se ajusta cualitativamente a este modelo."},
{cat:"Cuestionario Smith & Smith – Cap. 11", q:"¿Qué facto res parecen ser importantes en la determinación de lo que un depredador selecciona para comer entre un posible conjunto de presas potenciales?", a:"La respuesta funcional (Holling, 1959) describe cómo la tasa de consumo de un depredador cambia con la densidad de presas. Tipo I: la tasa de consumo aumenta linealmente con la densidad de presa hasta un máximo (filtración: mejillones, dafnia). Tipo II (más común): la tasa de consumo aumenta pero con saturación (curva hiperbólica) porque cada presa requiere tiempo de manejo; es desestabilizante. Tipo III: sigmoide; la tasa de consumo es baja a densidades bajas (búsqueda de imagen), aumenta rápidamente y se satura; es estabilizante."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Considera usted que los depredado res evalúan directamente la rentabilidad de la presa antes de seleccionar o descartar una presa posible?", a:"Las plantas C3 fijan el CO₂ directamente mediante la enzima RuBisCO, produciendo un compuesto de 3 carbonos (3-fosfoglicerato). Son ineficientes a altas temperaturas y baja CO₂ por la fotorrespiración. Las plantas C4 (maíz, caña de azúcar, sorgo) concentran el CO₂ en células del mesófilo antes de enviarlo a las células del haz, eliminando casi la fotorrespiración: son más eficientes en climas cálidos y áridos. Las plantas CAM (cactus, agaves, piñas) abren los estomas de noche para fijar CO₂, minimizando la pérdida de agua."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿cómo podría evolucionar una estrategia de aprovisionamiento?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 3", q:"¿Qué es la respuesta numérica?", a:"El fotoperiodismo es la respuesta de los organismos a la duración relativa del día y la noche (fotoperiodo). En plantas, controla la floración: plantas de día largo (florecen cuando el día supera un umbral crítico: cereales, espinacas), plantas de día corto (florecen cuando el día es corto: crisantemos, café), y plantas neutras (no responden al fotoperiodo: tomate). En animales, el fotoperiodo regula la reproducción estacional, la migración, la muda y la hibernación."},
{cat:"Cuestionario Smith & Smith – Cap. 10", q:"¿Qué términos del mode lo de la dinámica de predador-presa de Lotka-Volterra presentados en el Apartado 14.2 relacionan la respuesta numérica de los depredadores hacia la presa?", a:"Las ecuaciones de competencia de Lotka-Volterra son: dN₁/dt = r₁N₁(K₁ − N₁ − α₁₂N₂)/K₁ y dN₂/dt = r₂N₂(K₂ − N₂ − α₂₁N₁)/K₂. Los coeficientes de competencia α₁₂ (efecto de un individuo de la especie 2 sobre la especie 1) y α₂₁ (efecto de sp. 1 sobre sp. 2) determinan el resultado. La coexistencia estable ocurre solo cuando la competencia intraespecífica es mayor que la interespecífica: α₁₂ < K₁/K₂ y α₂₁ < K₂/K₁."},
{cat:"Cuestionario Smith & Smith – Cap. 5", q:"¿De qué modo pueden los depredadores funcionar como agentes de selección natural entre las poblaciones de presas?", a:"Una adaptación es un rasgo heredable que aumenta la aptitud darwiniana (fitness) de un individuo en su ambiente particular. Las adaptaciones son el resultado de la selección natural actuando sobre la variación genética durante generaciones. Pueden ser morfológicas (forma del cuerpo, coloración), fisiológicas (osmorregulación, termorregulación) o conductuales (migración, comunicación). No todas las características de un organismo son adaptaciones: algunas son restricciones evolutivas o efectos secundarios de otras adaptaciones."},
{cat:"Cuestionario Smith & Smith – Cap. 7", q:"¿Cuáles son las defensas contra el depredador permanen tes y cuáles son las inducidas?", a:"El efecto Allee describe la reducción de la aptitud individual a bajas densidades de población. Causas: dificultad para encontrar pareja (costo de Allee más común), reducción de la defensa grupal contra depredadores, menor termorregulación grupal, menor éxito de polinización, falta de aprendizaje social. La consecuencia es un umbral mínimo de densidad (densidad crítica de Allee) por debajo del cual la población declina irremediablemente hacia la extinción. Es crucial en conservación de especies en peligro."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿De qué modo puede una presa funcionar como agente de selección natural en las poblaciones de depredadores?", a:"Los organismos semelparos se reproducen una sola vez en su vida y luego mueren (big-bang reproduction): salmón del Pacífico, agave, muchas especies de insectos y plantas anuales. Los iteróparos se reproducen en múltiples ocasiones a lo largo de su vida: mamíferos grandes, aves, árboles perennes. La semelparia es favorecida por selección natural cuando la probabilidad de sobrevivir para volver a reproducirse es baja y cuando el primer evento reproductivo puede ser enorme."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿De qué manera difieren ambos procesos?", a:"Los procesos ecológicos ocurren a escalas muy diversas. Los fenómenos fisiológicos ocurren en milisegundos, mientras que la formación de biomas requiere milenios. Espacialmente, los procesos van desde milímetros (microhábitats) hasta miles de kilómetros (biomas). La escala importa porque los patrones y procesos visibles a una escala pueden no ser perceptibles a otra. Los ecólogos deben especificar la escala de estudio para que sus conclusiones sean interpretadas correctamente."},
{cat:"Cuestionario Smith & Smith – Cap. 11", q:"¿Cómo pudo haberse desarrollado este complejo ciclo vital?", a:"El modelo Lotka-Volterra para la interacción depredador-presa describe: dN/dt = rN − aNP (presa) y dP/dt = baNP − mP (depredador), donde N = abundancia de presa, P = abundancia de depredador, r = tasa de crecimiento de la presa, a = tasa de ataque del depredador, b = eficiencia de conversión de presa a descendencia del depredador, m = tasa de mortalidad del depredador. Las soluciones generan oscilaciones cíclicas neutras (ciclos de Lotka-Volterra). El ciclo liebre-lince se ajusta cualitativamente a este modelo."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿De qué manera una distribución fragmentada o aglutina da de hospedadores afecta la expansión de los parásitos?", a:"Los individuos de una población pueden distribuirse de tres formas: 1) Distribución aleatoria: la presencia de un individuo en un lugar no afecta la probabilidad de encontrar otro. Es la menos común en la naturaleza. 2) Distribución uniforme o regular: los individuos están equidistantes entre sí, típica donde hay territorialidad o alelopatía. 3) Distribución agrupada o en parches: la más común en la naturaleza; los individuos se agrupan por recursos, comportamiento social o reproducción vegetativa."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Qué distribución espacial de hospedadores (aleatoria, uniforme o aglutinada) dificultaría en mayor grado la transmisión de parásitos de un hospedador a otro?", a:"Los individuos de una población pueden distribuirse de tres formas: 1) Distribución aleatoria: la presencia de un individuo en un lugar no afecta la probabilidad de encontrar otro. Es la menos común en la naturaleza. 2) Distribución uniforme o regular: los individuos están equidistantes entre sí, típica donde hay territorialidad o alelopatía. 3) Distribución agrupada o en parches: la más común en la naturaleza; los individuos se agrupan por recursos, comportamiento social o reproducción vegetativa."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Qué es el mutualimo?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 10", q:"¿Son realmente mutualistas?", a:"G. Evelyn Hutchinson (1957) definió el nicho como un hipervolumen n-dimensional: el conjunto de todas las combinaciones de n factores ambientales (recursos, condiciones) dentro de las cuales una especie puede sobrevivir y reproducirse. El nicho fundamental es el espacio de nicho disponible en ausencia de competidores. El nicho realizado es la porción del nicho fundamental que realmente ocupa la especie en presencia de competidores. Los competidores comprimen el nicho realizado por debajo del fundamental."},
{cat:"Cuestionario Smith & Smith – Cap. 11", q:"¿Es la depredación de frutos una manera arriesgada de distribuir las semillas?", a:"La depredación (interacción +/−) incluye varios tipos: carnívoros (animales que cazan y consumen animales), herbívoros (animales que consumen plantas; también llamada herbivoria), y omnívoros (consumen tanto plantas como animales). También incluye granívoros (semillas), frugívoros (frutos), nectarívoros, y filtración de plancton. La depredación afecta la dinámica de las poblaciones de presa (selección de los menos aptos, control del tamaño) y del depredador (disponibilidad de alimento determina la reproducción)."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿Es el mutualismo una explotación recíproca o dos especies actuando de forma conjunta para beneficio mutuo?", a:"Una comunidad ecológica es el conjunto de poblaciones de diferentes especies que coexisten en un mismo lugar al mismo tiempo. Las comunidades son sistemas integrados: las interacciones entre las especies (competencia, depredación, mutualismo, parasitismo) determinan la composición, estructura y dinámica de la comunidad. Existen dos visiones: la visión clementsiana (la comunidad como superorganismo integrado con límites netos) y la visión gleassoniana (la comunidad como asociación individualista sin límites definidos)."},
{cat:"Cuestionario Smith & Smith – Cap. 15", q:"¿Por qué se clasifican las plantas como especies basales en la estructura de una red trófica?", a:"Una red trófica (food web) es la representación de todas las relaciones alimentarias en una comunidad: quién come a quién. Los elementos son: productores (plantas, algas, cianobacterias), consumidores primarios (herbívoros), consumidores secundarios (carnívoros que comen herbívoros), consumidores terciarios (carnívoros que comen carnívoros) y descomponedores (bacterias y hongos que descomponen la materia orgánica). Las redes tróficas reales son mucho más complejas que las cadenas alimentarias lineales, con múltiples conexiones."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Son todos los carnívoros depredadores superiores?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 11", q:"¿Qué distingue a un depredador superior en la estructura de una cadena trófica?", a:"Las cascadas tróficas son los efectos indirectos que un depredador superior ejerce sobre niveles tróficos inferiores (cascada hacia abajo). La reintroducción de lobos (Canis lupus) en Yellowstone en 1995 es el ejemplo clásico: los lobos redujeron y redistribuyeron a los alces, permitiendo la recuperación de álamos y sauces, lo que mejoró el hábitat de castores y aves canoras. La pérdida de depredadores apicales suele causar explosiones de herbívoros y degradación de la vegetación (efecto cascada inverso)."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿sugiere el concepto holístico o individualista de las comunidades?", a:"Una comunidad ecológica es el conjunto de poblaciones de diferentes especies que coexisten en un mismo lugar al mismo tiempo. Las comunidades son sistemas integrados: las interacciones entre las especies (competencia, depredación, mutualismo, parasitismo) determinan la composición, estructura y dinámica de la comunidad. Existen dos visiones: la visión clementsiana (la comunidad como superorganismo integrado con límites netos) y la visión gleassoniana (la comunidad como asociación individualista sin límites definidos)."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿De qué modo la estructura de la vegetación dentro de una comunidad influye en la diversidad de la vida animal?", a:"La diversidad alfa (α) es la diversidad dentro de un hábitat o comunidad local: incluye riqueza de especies (número de especies) y equitatividad (cómo se distribuye la abundancia entre las especies). La diversidad beta (β) es la tasa de cambio en la composición de especies entre hábitats o a lo largo de un gradiente: β = γ/α. La diversidad gamma (γ) es la diversidad total de una región o paisaje. Whittaker introdujo estos términos en 1960 para analizar la diversidad a múltiples escalas espaciales."},
{cat:"Cuestionario Smith & Smith – Cap. 4", q:"¿De qué modo la disponibilidad de nutrientes del suelo modifica la naturaleza de la competencia desde la forma simétrica a la asimétrica?", a:"El pH del suelo (medida de acidez/alcalinidad en escala 1-14) determina la disponibilidad de nutrientes para las plantas. La mayoría de las plantas crecen mejor entre pH 6-7. En suelos ácidos (pH<5.5), el aluminio y el manganeso se solubilizan y pueden ser tóxicos; el fósforo, calcio y magnesio son menos disponibles. En suelos alcalinos (pH>8), el hierro, manganeso, zinc y boro son menos disponibles. Los nutrientes esenciales incluyen macronutrientes (N, P, K, Ca, Mg, S) y micronutrientes (Fe, Mn, Zn, Cu, B, Mo, Cl)."},
{cat:"Cuestionario Smith & Smith – Cap. 16", q:"¿Es este un ejemplo de sucesión primaria o secundaria?", a:"La sucesión ecológica es el proceso de cambio direccional y predecible en la composición y estructura de una comunidad a lo largo del tiempo. Sucesión primaria: ocurre en áreas sin suelo ni biota previa: flujos de lava, dunas nuevas, superficies glaciares. Es lenta porque requiere formación de suelo. Sucesión secundaria: ocurre en áreas perturbadas donde queda suelo y banco de semillas: campos abandonados, zonas quemadas, bosques talados. Es más rápida porque la base del suelo ya existe."},
{cat:"Cuestionario Smith & Smith – Cap. 6", q:"¿Cuál de estas tres estrategias vegetales se encuentra con más probabilidad colonizando un lugar recientemente perturbado (especies tempranas en la sucesión)?", a:"Los individuos de una población pueden distribuirse de tres formas: 1) Distribución aleatoria: la presencia de un individuo en un lugar no afecta la probabilidad de encontrar otro. Es la menos común en la naturaleza. 2) Distribución uniforme o regular: los individuos están equidistantes entre sí, típica donde hay territorialidad o alelopatía. 3) Distribución agrupada o en parches: la más común en la naturaleza; los individuos se agrupan por recursos, comportamiento social o reproducción vegetativa."},
{cat:"Cuestionario Smith & Smith – Cap. 16", q:"¿Cuál de las tres estrategias vegetales es la que más probablemente caracteriza a las especies más tardías en la sucesión?", a:"Connell y Slatyer (1977) propusieron tres modelos de sucesión: 1) Facilitación: las especies pioneras modifican el ambiente haciéndolo más favorable para las especies tardías (que finalmente las reemplazan). Las especies tardías solo llegan después de que los pioneros han preparado el terreno. 2) Tolerancia: las especies de etapas tardías toleran peores condiciones que las pioneras y pueden establecerse en cualquier etapa, pero crecen más lento que los pioneros inicialmente. 3) Inhibición: las especies establecidas inhiben la colonización de nuevas especies; la sucesión avanza solo cuando mueren los individuos establecidos."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿Por qué la capacidad de tolerar la baja disponibilidad de recursos a menudo está asociada con las especies de plan tas que dominan durante las etapas más tardías de la sucesión?", a:"La Hipótesis del Disturbio Intermedio (IDH, Connell 1978) propone que la diversidad de especies es máxima a niveles intermedios de disturbio (en frecuencia e intensidad). A baja frecuencia de disturbio, las especies competitivamente superiores dominan y excluyen a las demás (exclusión competitiva). A alta frecuencia de disturbio, solo las especies más tolerantes al disturbio sobreviven. A niveles intermedios, coexisten colonizadores y especies tardías, maximizando la diversidad. Se ha probado en arrecifes de coral, praderas y bosques."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿De qué manera el estudio del patrón espacial es la característica que define la ecología del paisaje?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Cómo dan origen las variaciones en el ambiente físico (geología, topografía, suelos y clima) a los patrones del paisaje en su región?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 24", q:"¿Cuáles son las diferencias entre frontera, borde y ecotono?", a:"La fragmentación del hábitat divide ecosistemas continuos en parches más pequeños y aislados. Sus efectos ecológicos son: 1) Reducción del área de los parches (menos especies pueden mantenerse, según la relación especie-área). 2) Aislamiento de los parches (dificulta la dispersión, el flujo génico y la recolonización tras extinción local). 3) Efecto de borde: la frontera entre el hábitat y la matriz circundante crea condiciones distintas (mayor temperatura, menor humedad, mayor disturbio) que afectan negativamente a las especies del interior."},
{cat:"Cuestionario Smith & Smith – Cap. 12", q:"¿Por qué los bordes y ecotonos con frecuencia alimentan una mayor diversidad de especies que las comunidades adyacentes?", a:"Los parásitos pueden regular las poblaciones de sus huéspedes actuando como factores dependientes de la densidad: a mayor densidad del huésped, mayor transmisión. Efectos: aumentan la mortalidad, reducen la fecundidad, debilitan al huésped haciéndolo más vulnerable a la depredación, reducen el crecimiento y la competitividad. Los modelos epidemiológicos muestran que los parásitos pueden mantener la diversidad en las comunidades al reducir preferentemente las especies dominantes (hipótesis del Mundo Rojo)."},
{cat:"Cuestionario Smith & Smith – Cap. 24", q:"¿Cómo cambia la relación entre proporción del borde y hábitat interior con el aumento del tamaño de la parcela?", a:"La fragmentación del hábitat divide ecosistemas continuos en parches más pequeños y aislados. Sus efectos ecológicos son: 1) Reducción del área de los parches (menos especies pueden mantenerse, según la relación especie-área). 2) Aislamiento de los parches (dificulta la dispersión, el flujo génico y la recolonización tras extinción local). 3) Efecto de borde: la frontera entre el hábitat y la matriz circundante crea condiciones distintas (mayor temperatura, menor humedad, mayor disturbio) que afectan negativamente a las especies del interior."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿Cómo cambia la diversidad de especies con el aumento del tamaño de parcela?", a:"La diversidad alfa (α) es la diversidad dentro de un hábitat o comunidad local: incluye riqueza de especies (número de especies) y equitatividad (cómo se distribuye la abundancia entre las especies). La diversidad beta (β) es la tasa de cambio en la composición de especies entre hábitats o a lo largo de un gradiente: β = γ/α. La diversidad gamma (γ) es la diversidad total de una región o paisaje. Whittaker introdujo estos términos en 1960 para analizar la diversidad a múltiples escalas espaciales."},
{cat:"Cuestionario Smith & Smith – Cap. 18", q:"¿En qué forma puede esta teoría aplicarse a las manchas de hábitat aisladas en los ambientes terrestres?", a:"Las pirámides ecológicas representan la estructura trófica de un ecosistema: Pirámide de energía: muestra el flujo de energía en cada nivel trófico; siempre tiene forma piramidal (segunda ley de la termodinámica). Pirámide de biomasa: biomasa en cada nivel trófico; generalmente piramidal en terrestres, pero puede invertirse en acuáticos (el fitoplancton tiene biomasa menor que el zooplancton en algunos momentos). Pirámide de números: número de individuos; puede invertirse (un árbol soporta miles de insectos)."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿Cómo influye el tamaño insular y el aislamiento (distancia a las islas vecinas) en los patrones de diversidad de especies?", a:"La diversidad alfa (α) es la diversidad dentro de un hábitat o comunidad local: incluye riqueza de especies (número de especies) y equitatividad (cómo se distribuye la abundancia entre las especies). La diversidad beta (β) es la tasa de cambio en la composición de especies entre hábitats o a lo largo de un gradiente: β = γ/α. La diversidad gamma (γ) es la diversidad total de una región o paisaje. Whittaker introdujo estos términos en 1960 para analizar la diversidad a múltiples escalas espaciales."},
{cat:"Cuestionario Smith & Smith – Cap. 8", q:"¿Cómo se relaciona la teoría de la biogeografía insular con el modelo de la dinámica de la metapoblación des arrollada por Richard Levins y presentada en el Capítulo 12 (Apartado12.2)?", a:"Una metapoblación (Levins, 1970) es un conjunto de poblaciones locales parcialmente aisladas pero conectadas por dispersión. Las poblaciones locales se extinguen y se recolonizan periódicamente. El modelo de Levins: dp/dt = mp(1-p) − ep, donde p es la fracción de parches ocupados, m es la tasa de colonización y e es la tasa de extinción local. El equilibrio p* = 1 - e/m; la metapoblación persiste globalmente si m > e. Fundamental para entender los efectos de la fragmentación del hábitat."},
{cat:"Cuestionario Smith & Smith – Cap. 14", q:"¿Cómo ayudan los corredores a mantener la diversidad de las parcelas de hábitats?", a:"La diversidad alfa (α) es la diversidad dentro de un hábitat o comunidad local: incluye riqueza de especies (número de especies) y equitatividad (cómo se distribuye la abundancia entre las especies). La diversidad beta (β) es la tasa de cambio en la composición de especies entre hábitats o a lo largo de un gradiente: β = γ/α. La diversidad gamma (γ) es la diversidad total de una región o paisaje. Whittaker introdujo estos términos en 1960 para analizar la diversidad a múltiples escalas espaciales."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿Cómo ha cambiado el paisaje que rodea a su hogar o vecindario desde que era una niña o niño?", a:"La ecología es la disciplina científica que estudia las relaciones entre los organismos y su entorno. El término fue acuñado por el biólogo alemán Ernst Haeckel en 1866, derivado del griego oikos (casa u hogar) y logos (estudio). Haeckel definió la ecología como \"el conjunto de conocimientos referentes a la economía de la naturaleza, la investigación de todas las relaciones del animal con su medio inorgánico y orgánico\". La ecología moderna abarca el estudio de cómo los organismos interactúan entre sí y con su ambiente físico, cómo se distribuyen en el espacio y el tiempo, y cómo los ecosistemas funcionan como sistemas integrados."},
{cat:"Cuestionario Smith & Smith – Cap. 26", q:"¿Qué procesos han sido los responsables de estos cambios?", a:"Los cambios globales provocados por la actividad humana incluyen: cambio climático (aumento de temperatura media global ~1.1°C desde la era preindustrial), pérdida de biodiversidad (tasa de extinción 100-1000 veces mayor que la basal), deforestación (se pierden ~10 millones de ha de bosque por año), eutrofización de aguas (por uso masivo de fertilizantes), acidificación de océanos (pH ha bajado de 8.2 a 8.1), y fragmentación de hábitats. La ecología proporciona la base científica para comprender y mitigar estos impactos."},
{cat:"Cuestionario Smith & Smith – Cap. 1", q:"¿De qué manera difieren los conceptos de comunidad y ecosistema?", a:"La ecología opera en múltiples niveles de organización biológica. Partiendo del más simple al más complejo: individuo (organismo), población (grupo de individuos de la misma especie en un área), comunidad (conjunto de poblaciones que coexisten), ecosistema (comunidad más su ambiente abiótico), paisaje (mosaico de ecosistemas), bioma (región climática con vegetación característica) y biosfera (totalidad de los ecosistemas de la Tierra). Cada nivel tiene propiedades emergentes que no pueden predecirse a partir de los niveles inferiores. Los ecólogos trabajan en todos estos niveles, desde el estudio del comportamiento individual hasta los ciclos globales de nutrientes."},
